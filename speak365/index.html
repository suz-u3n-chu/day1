/* Layout: a pocket study book for one thumb — five bottom tabs and a full-screen sheet for drills.
   Colour has exactly two meanings. Red = the part to memorise (in the English and in the matching Japanese).
   Green = said it / it has stuck. Everything else is ink on paper; stress is weight + underline, never colour. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#15181E; --muted:#5F6773; --line:#DADDE2; --fill:#EBEDF0; --on-ink:#FFFFFF;
  --key:#D4271B; --key-soft:#FBE4E1;
  --ok:#17794A; --ok-soft:#DCEFE4; --on-ok:#FFFFFF; --h1:#CFE8DA; --h2:#8FCDAA; --h3:#3F9F6E; --h4:#17794A;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#181B20; --ink:#ECEEF1; --muted:#9AA2AD; --line:#2A2F36; --fill:#22262C; --on-ink:#0F1114;
    --key:#FF7A6C; --key-soft:#3A1F1C;
    --ok:#4FC48D; --ok-soft:#163222; --on-ok:#0F1114; --h1:#173426; --h2:#1F5A3D; --h3:#2F8A5E; --h4:#4FC48D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#181B20; --ink:#ECEEF1; --muted:#9AA2AD; --line:#2A2F36; --fill:#22262C; --on-ink:#0F1114;
  --key:#FF7A6C; --key-soft:#3A1F1C;
  --ok:#4FC48D; --ok-soft:#163222; --on-ok:#0F1114; --h1:#173426; --h2:#1F5A3D; --h3:#2F8A5E; --h4:#4FC48D; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* the two meanings */
.k{color:var(--key);font-weight:700}
.st{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ok-t{color:var(--ok);font-weight:700}
.small{font-size:12.5px;line-height:1.6;margin:0}
/* red sheet: hides the English key parts on study pages; tap one to check it */
body.sheet-on .study b.k:not(.j){color:transparent;background:var(--key-soft);border-radius:4px;cursor:pointer;-webkit-user-select:none;user-select:none}
body.sheet-on .study b.k.shown:not(.j){color:var(--key);background:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand-en{font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand-ja{font-size:11px;color:var(--muted)}
.top-stat{display:flex;gap:16px;text-align:right}
.top-stat div{display:flex;flex-direction:column;line-height:1.15}
.top-stat b{font-size:19px;font-variant-numeric:tabular-nums}
.top-stat span{font-size:10.5px;color:var(--muted)}
.subnav{padding-bottom:10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1;padding:0 13px;min-height:36px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chip-n{color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.chip-ok{color:var(--ok);font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:700}
.chip[aria-pressed="true"] .chip-n,.chip[aria-pressed="true"] .chip-ok{color:inherit}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;padding:7px 6px;border-radius:9px;font-size:13px;cursor:pointer;text-align:center;min-width:0}
.seg button small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:700}
.seg button[aria-pressed="true"] small{color:inherit}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

main{padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0}
.h-title{margin:0;font-size:18px;font-weight:700;line-height:1.4;text-wrap:balance}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 2px 0}
.sec-h h2{margin:0;font-size:15px;font-weight:700}
.sec-h span{font-size:12px;color:var(--muted)}

/* buttons */
.big-btn{width:100%;min-height:56px;border-radius:14px;border:0;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.big-btn small{font-weight:400;font-size:13px}
.line-btn{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;cursor:pointer}
.act{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.act svg{width:16px;height:16px;flex:none}
.act.main{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.mini{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.play-sm{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.play-sm svg{width:17px;height:17px}
.no-tts .play-sm,.no-tts .play{display:none}
.got[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok);font-weight:700}

/* today */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-day{font-weight:700;font-size:22px;line-height:1.3;margin-top:2px}
.phase-pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-grid div{border-radius:12px;padding:10px;background:var(--fill)}
.hero-grid b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.hero-grid span{font-size:11.5px;color:var(--muted)}
.hero-next{font-size:13.5px;margin:0;display:flex;flex-direction:column;gap:2px}
.hero-next span{color:var(--muted);font-size:12px}
.cleared{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px}
.cleared svg{width:26px;height:26px;color:var(--ok);flex:none}
.streak-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.streak-big{font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.streak-big small{font-size:14px;font-weight:400;color:var(--muted)}
.tot{font-size:12.5px;text-align:right;line-height:1.5}
.tot b{color:var(--ink);font-size:16px}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--fill);max-width:100%}
.heat i.l1{background:var(--h1)} .heat i.l2{background:var(--h2)} .heat i.l3{background:var(--h3)} .heat i.l4{background:var(--h4)}
.heat i.fut{background:transparent}
.heat i.now{outline:2px solid var(--ink);outline-offset:-1px}
.heat-legend{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);gap:8px}
.heat-legend span{display:inline-flex;gap:3px;align-items:center}
.heat-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--fill)}
.mission{font-size:16px;line-height:1.6;margin:0}
.check-list{display:flex;flex-direction:column;gap:2px}
.ck{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px 4px;cursor:pointer;font-size:14px;line-height:1.55;border-radius:10px}
.ck:focus-visible{outline:2px solid var(--ink)}
.ck .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.ck .box svg{width:14px;height:14px;opacity:0;color:var(--on-ok)}
.ck[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed="true"] .box svg{opacity:1}
.ck[aria-pressed="true"] .ck-t{color:var(--muted)}
.mission-btn{align-self:flex-start;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mission-btn svg{width:16px;height:16px}
.mission-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;flex-direction:column;gap:5px}
.bar-lbl{display:flex;justify-content:space-between;font-size:13px}
.bar-lbl b{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--fill);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-go{background:var(--h2)}
.bar-key{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.bar-key span{display:inline-flex;align-items:center;gap:5px}
.bar-key i{width:10px;height:10px;border-radius:2px;display:inline-block}
.prac-g{display:flex;flex-direction:column;gap:12px}
.prac-g p{margin:0 0 6px;font-size:12px;color:var(--muted)}
.prac{display:flex;flex-wrap:wrap;gap:8px}
.prac .chip{min-height:40px}
.road{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.road li{position:relative;padding:0 0 18px 30px}
.road li:last-child{padding-bottom:0}
.road li::before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)}
.road li:last-child::before{display:none}
.road .dot{position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.road li.past .dot{background:var(--ok);border-color:var(--ok)}
.road li.now .dot{border-color:var(--ink);background:var(--ink)}
.road-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.road-h b{font-size:15px}
.road-h span{font-size:12px;color:var(--muted)}
.road-sub{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.road-detail{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.road-goal{background:var(--fill);border-radius:10px;padding:10px 12px}
.road-goal b{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.set-row{display:flex;flex-direction:column;gap:8px}
.set-row > span{font-size:13px;font-weight:700}
.status{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.6}
.status i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:6px}
.status.on i{background:var(--ok)}
.legend-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.legend-list li{display:flex;gap:10px;align-items:baseline}
.legend-list .sw{flex:none;width:5.5em;font-weight:700}
.steps-ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.code-box{width:100%;min-height:76px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.linkish{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}

/* lists (core / patterns) */
.stage-head{display:flex;flex-direction:column;gap:2px;margin:6px 2px 10px}
.stage-head p{margin:0;font-size:13px;color:var(--muted)}
.stage-head h2{margin:0;font-size:17px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center}
.row+.row,.ph+.ph{border-top:1px solid var(--line)}
.row-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:13px 4px 13px 14px;cursor:pointer}
.row-btn:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.pnum{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--fill);font-variant-numeric:tabular-nums}
.row.solid .pnum{background:var(--ok-soft);color:var(--ok)}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pstem{font-weight:700;font-size:16.5px;line-height:1.35;overflow-wrap:anywhere}
.pja{font-size:13px;color:var(--muted);line-height:1.45}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:14px;height:4px;border-radius:2px;background:var(--fill)}
.dots i.d1{background:var(--h2)} .dots i.d2{background:var(--ok)}
.fav{flex:none;width:44px;height:44px;margin-right:6px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--muted);padding:0}
.fav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.fav[aria-pressed="true"]{color:var(--ink)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.legend{font-size:12px;color:var(--muted);margin:10px 2px 0}

/* detail */
.back{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding-right:10px;font-size:14px;font-weight:700;cursor:pointer}
.back svg{width:18px;height:18px}
.det-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.det-tools{display:flex;align-items:center;gap:4px}
.det-head{display:flex;flex-direction:column;gap:6px}
.det-stem{font-weight:700;font-size:28px;line-height:1.2;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.det-k{font-size:15px;color:var(--muted)}
.det-j{font-size:16.5px;font-weight:700}
.cores{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.core-c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.core-c .w{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.core-c .m{font-size:13px;color:var(--muted);line-height:1.5}
.cores.plain{grid-template-columns:1fr}
.cores.plain .core-c{flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
.pic{width:60px;height:40px;display:block}
.pic .n{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pic .nd{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 3;stroke-linecap:round}
.pic .nf{fill:var(--muted);stroke:none}
.pic .k{fill:none;stroke:var(--key);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pic .kd{fill:none;stroke:var(--key);stroke-width:2.2;stroke-dasharray:2.5 3.5;stroke-linecap:round}
.pic .kf{fill:var(--key);stroke:none}
.pic-note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pts li{display:flex;gap:10px;font-size:14px;line-height:1.7}
.pts li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink);margin-top:.75em}
.exl{display:flex;flex-direction:column}
.exl > div{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.exl > div+div{border-top:1px solid var(--line)}
.exl .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.en{font-size:18px;line-height:1.45;overflow-wrap:anywhere}
.ja{font-size:13.5px;color:var(--muted);line-height:1.55}
.ja .k{font-weight:700}
.drl{display:flex;flex-direction:column}
.drl > div{padding:12px 0;display:flex;flex-direction:column;gap:8px}
.drl > div+div{border-top:1px solid var(--line)}
.drl .q{display:flex;gap:10px;align-items:baseline;font-size:15px}
.drl .q i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);flex:none;width:12px}
.drl .q .en{font-size:17px}
.drl .sub,.drl .acts,.drl .hint,.drl .ans{padding-left:22px}
.drl .sub{font-size:13px;color:var(--muted)}
.blank{display:inline-block;width:calc(var(--n,4) * .52em);min-width:1.4em;border-bottom:2px solid var(--ink);height:1em;vertical-align:-.12em}
.hint{font-size:17px;line-height:1.7;color:var(--muted)}
.ans{display:flex;gap:10px;align-items:flex-start}
.ans .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.why{font-size:13px;color:var(--muted);margin:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;text-align:left;min-width:0}
.pn button:last-child{align-items:flex-end;text-align:right}
.pn small{font-size:11px;color:var(--muted)}
.pn span{font-weight:700;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn button:disabled{visibility:hidden}
.tip-ex{display:flex;flex-direction:column;gap:0}
.tip-ex > div{display:flex;gap:10px;align-items:center;padding:8px 0}
.tip-ex > div+div{border-top:1px solid var(--line)}
.tip-ex .tx{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.tip-ex .en{font-weight:700}
.tip-ex .kn{font-size:14px}
.tip-ex .nt{font-size:12.5px;color:var(--muted)}

/* phrases */
.tools{display:flex;gap:8px}
.tools input{flex:1;min-width:0;font:16px var(--font);padding:0 12px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.tools input::placeholder{color:var(--muted)}
.toggle{flex:none;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.chap{margin-top:22px}
.chap-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.chap-n{font-weight:700;font-size:26px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.chap-t{flex:1;min-width:0}
.chap-t h2{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.chap-t p{margin:0;font-size:12px;color:var(--muted)}
.chap-p{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.chap-p small{color:var(--muted);font-weight:400;font-size:12px}
.ph.open{background:var(--bg)}
.ph-row{display:flex;align-items:flex-start}
.ph-head{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0;padding:14px 4px 14px 14px;cursor:pointer}
.ph-head:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
.ph .fav{margin-top:5px}
.pno{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--fill);font-variant-numeric:tabular-nums;margin-top:1px}
.done .pno{background:var(--ok-soft);color:var(--ok)}
.ph-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ph-main .en{font-size:18.5px;transition:filter .2s}
.ph-main .ja{font-size:14px}
.ph-body{padding:0 14px 16px 56px;display:flex;flex-direction:column;gap:12px}
.hide-en .ph:not(.open) .ph-main .en{filter:blur(7px);-webkit-user-select:none;user-select:none}
.hide-en .ph-main .ja{order:-1;color:var(--ink);font-size:15px}
.kana{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lbl{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;line-height:1.5;flex:none}
.kana-t{font-size:16px}
.note{margin:0;font-size:14px;line-height:1.75}
.dlg{background:var(--fill);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ph.open .dlg{background:var(--surface)}
.dlg p{margin:0;display:flex;gap:10px;font-size:15px;line-height:1.5}
.dlg p > span:last-child{min-width:0;overflow-wrap:anywhere}
.who{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px}
.dlg .tr{display:block;font-size:12.5px;color:var(--muted);padding-left:30px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:36px 8px}
.searching{font-size:12px;color:var(--muted);margin:14px 0 0}

/* favorites */
.fav-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.v-title{margin:0;font-weight:700;font-size:24px;line-height:1.2}
.fav-empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.fav-empty svg{width:40px;height:40px;fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round}
.fav-empty h3{margin:0;font-size:16px}

/* session sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column}
.sheet > .wrap{width:100%}
.sheet-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:10px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}
.sbar{flex:1;height:8px;background:var(--fill);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.scount{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}
.sheet-body{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.fc-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:24px}
.tag{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag b{color:var(--ink)}
.fc-fav{margin:-12px -10px -12px 0}
.fc-ja{font-size:22px;font-weight:700;line-height:1.5;margin:0;text-wrap:balance}

.fc-sub{font-size:14px;color:var(--muted);margin:0}
.fc-q{font-size:24px;line-height:1.45;margin:0;overflow-wrap:anywhere}
.fc-hint{font-size:20px;line-height:1.8;color:var(--muted);margin:0}
.fc-say{color:var(--muted);font-size:13px;margin:auto 0 0}
.fc-ans{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.fc-en{font-size:25px;line-height:1.35;margin:0;overflow-wrap:anywhere}
.fc-en.head{font-weight:700}
.fc-kana{margin:0;font-size:16px}
.verdict{margin:0;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.verdict svg{width:20px;height:20px}
.verdict.good{color:var(--ok)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:19px;cursor:pointer;padding:6px 16px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt svg{width:20px;height:20px;flex:none}
.opt:disabled{cursor:default;color:var(--muted)}
.opt.right{background:var(--ok);border-color:var(--ok);color:var(--on-ok);font-weight:700}
.opt.answer{border-color:var(--key);color:var(--key);font-weight:700;border-width:2px}
.opt.wrong{text-decoration:line-through}
.intro-stem{font-weight:700;font-size:27px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.ctl{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.btn{min-height:56px;border-radius:14px;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;gap:2px}
.btn small{font-size:11px;font-weight:400}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn.ok2{border-color:var(--ok);color:var(--ok);border-width:2px}
.done-card{text-align:center;align-items:center;justify-content:center}
.done-card .big{font-weight:700;font-size:56px;line-height:1;color:var(--ok);font-variant-numeric:tabular-nums}
.done-card p{margin:0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{all:unset;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--muted);cursor:pointer;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.tab-ic{position:relative;display:inline-flex}
.tab-badge{position:absolute;top:-5px;left:14px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--on-ink);font:700 10.5px/18px var(--font);text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:560px;margin:0 auto;background:var(--ink);color:var(--on-ink);padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

?","I needed a change.","なんで旅に出ようと思ったの？ ／ 変化がほしかったんだ"],[28,"I've *always* wanted to do this.","アイヴ オールウェイズ ウォンティッ(d) トゥ ドゥ ディス","ずっとこれがやりたかった","夢をかなえている最中に。","Why a trip around the world?","I've always wanted to do this.","なんで世界一周？ ／ ずっとこれがやりたかったんだ"],[28,"It *changed* my *life*.","イッ(t) チェインジ(d) マイ ライ(f)","人生が変わった","大きな経験を語るときに。","How was living abroad?","It changed my life.","海外に住んでみてどうだった？ ／ 人生が変わったよ"],[28,"I'm still *figuring* it *out*.","アイム スティル フィギュアリンギッ(t) アウ(t)","まだ模索中なんだ","将来のことを聞かれて答えが決まっていないときに。","What's next after the trip?","I'm still figuring it out.","旅のあとはどうするの？ ／ まだ模索中なんだ"],[28,"What do you *miss* most about *home*?","ワッドゥユー ミス モウス(t) アバウ(t) ホウム","地元で一番恋しいものは？","旅人同士で盛り上がる質問。","What do you miss most about home?","My mom's cooking.","地元で一番恋しいものは？ ／ 母の料理"],[28,"I don't *regret* it.","アイ ドン リグレディッ(t)","後悔してない","大きな決断を振り返るときに。","Was it scary to quit?","A little, but I don't regret it.","辞めるの怖かった？ ／ ちょっとね、でも後悔してない"],[28,"Life's too *short*.","ライフス トゥー ショー(t)","人生は短いからね","やりたいことをやろう、という気持ちで。","Should I go to the concert?","Go! Life's too short.","ライブ行こうか迷う ／ 行きなよ！人生短いんだから"],[28,"Everything happens for a *reason*.","エヴリスィン ハプンズ フォーラ リーズン","全部意味があって起きてる","トラブルを前向きにとらえるときに。深刻な不幸にあった人に言うと無神経に聞こえるので注意。","I missed my flight, but I met you.","Everything happens for a reason.","フライト逃したけど、君に会えた ／ 全部意味があって起きてるんだね"],[28,"I'm *grateful* for this *trip*.","アイム グレイ(t)フォー フォー ディス トゥリッ(p)","この旅に感謝してる","旅の終わりや、しみじみしたときに。","Any regrets?","None. I'm grateful for this trip.","後悔ある？ ／ ない。この旅に感謝してる"],[29,"I'm gonna *miss* you.","アイム ゴナ ミス ユー","寂しくなるな","別れ際の本音。I'll miss you. も同じ。","I leave tomorrow morning.","I'm gonna miss you.","明日の朝出発するんだ ／ 寂しくなるな"],[29,"It was *great* *meeting* you.","イッ(t) ワズ グレイ(t) ミーティン ユー","会えてよかった","初対面の人との別れ際に。最初の Nice to meet you. と対になる。","It was great meeting you.","You too!","会えてよかった ／ こちらこそ！"],[29,"Come *visit* me in *Japan*!","カム ヴィズィッ(t) ミー イン ジャパン","日本に遊びに来てね！","仲良くなった人へ。本気で言うと喜ばれる。","I'd love to see Japan someday.","Come visit me in Japan!","い var K=[{"id":"k01","u":0,"t":"in / on / at（場所）","j":"中にいる・面に接している・地点","core":[["in","in","囲まれた空間の中"],["on","on","面に接している"],["at","at","地図の上の一点"]],"ex":[["I'm {in} Paris now.","今パリ[に]いる"],["Your phone is {on} the table.","スマホはテーブル[の上に]あるよ"],["Let's meet {at} the station.","駅[で]会おう"],["The menu is {on} the wall.","メニューは壁[に]あるよ"],["I left my bag {in} the taxi.","タクシー[の中に]バッグを忘れた"],["I'm {on} the bus.","今バス[に]乗ってる"]],"pt":["日本語の「に・で」は、英語では場所の見え方で変わる。中にいるなら in、くっついているなら on、地点として言うなら at","on は「上」ではなく「接触」。壁（on the wall）・階（on the third floor）・通り（on this street）も on","乗り物：中を歩ける大きさ（bus / train / plane）は on、座るだけの小さい箱（car / taxi）は in","at the station / at the airport / at home / at work は「その地点にいる」。建物の中だと強調したいときは in"],"q":[{"p":"I'm ___ the bus stop now.","o":["at","on","in"],"j":"今バス停にいる","w":"バス停を地図の上の一点として言うので at"},{"p":"There's a café ___ the second floor.","o":["on","in","at"],"j":"2階にカフェがある","w":"階は「面」なので on"},{"p":"She lives ___ Italy.","o":["in","at","on"],"j":"彼女はイタリアに住んでる","w":"国・街は in"},{"p":"I'm ___ the train. I'll be there in ten minutes.","o":["on","in","at"],"j":"今電車の中。10分で着く","w":"電車・バス・飛行機は on"},{"j":"ホテルで会おう","e":"Let's meet {at} the hotel."},{"j":"鍵はテーブルの上にあるよ","e":"The key is {on} the table."},{"j":"車の中に財布を忘れた","e":"I left my wallet {in} the car."}]},{"id":"k02","u":0,"t":"in / on / at（時間）","j":"時刻は at・日は on・月や年は in","core":[["at","t_at","時刻（点）"],["on","t_on","日・曜日"],["in","t_in","月・年・季節（幅がある）"]],"ex":[["The tour starts {at} nine.","ツアーは9時[に]始まる"],["I'm leaving {on} Friday.","金曜[に]出発する"],["I'm going back to Japan {in} March.","3月[に]日本に帰る"],["See you {on} Monday morning.","月曜の朝[に]ね"],["I usually work {in} the morning.","たいてい午前中[に]仕事する"],["See you {tomorrow}.","また[明日]（tomorrow の前には何もつけない）"]],"pt":["短い順に at（時刻）→ on（日）→ in（月・年・季節）。幅が広くなるほど in","in the morning / in the afternoon / in the evening だけど、夜は at night。曜日がつくと on Friday night","today, tomorrow, yesterday, this 〜, next 〜, last 〜, every 〜 の前には前置詞をつけない（× on next Monday）"],"q":[{"p":"Let's meet ___ 7:30.","o": u from around here?","この辺の人[ですか]？"],["{I'm not} hungry yet.","まだお腹すいて[ない]"],["{Do} you speak English?","英語は話し[ますか]？"],["I {don't} eat meat.","肉は食べ[ません]"],["{Does} this bus go to the airport?","このバスは空港に行き[ますか]？"],["She {doesn't} live here.","彼女はここには住んで[ない]"],["A: {Did} you sleep well?  B: Yes, I {did}.","A: よく眠れ[た]？ B: うん、[眠れた]"]],"pt":["be（am / is / are）の文は be だけで作れる。否定は not をつける、質問は be を前に出す：I'm not tired. / Are you tired?","ふつうの動詞（like, work, go, have など）は do の力を借りる：I don't 〜 / Do you 〜?　he / she / it なら does、過去なら did","he / she / it の「今」の文は動詞に s（She works here.）。does / did を使ったら動詞は元の形に戻す：× Does she works? → ○ Does she work?　× I didn't went. → ○ I didn't go.","be と do を混ぜない：× Are you like coffee? → ○ Do you like coffee?　× I'm not understand. → ○ I don't understand.　短い答えも聞かれた言葉で返す：Yes, I do. / No, I'm not."],"q":[{"p":"___ you like spicy food?","o":["Do","Are","Does"],"j":"辛い食べ物は好き？","w":"like は動詞なので Do you 〜?（× Are you like）"},{"p":"Sorry, I ___ understand.","o":["don't","am not","not"],"j":"すみません、わかりません","w":"understand は動詞なので don't（× I'm not understand）"},{"p":"___ this train stop at the airport?","o":["Does","Do","Is"],"j":"この電車は空港に止まりますか？","w":"主語が this train（it と同じ）なので Does。後ろの動詞は元の形"},{"p":"I didn't ___ breakfast this morning.","o":["have","had","having"],"j":"今朝は朝食を食べなかった","w":"didn't の後ろは元の形（× didn't had）"},{"p":"A: Are you tired?  B: No, ___.","o":["I'm not","I don't","I not"],"j":"A: 疲れてる？ B: ううん、疲れてない","w":"Are you 〜? と聞かれたら be で答える：No, I'm not."},{"j":"彼女は大阪に住んでる","e":"She {lives} in Osaka."},{"j":"そのお店は何時に開きますか？","e":"What time {does} the shop open?"}]},{"id":"k25","u":2,"t":"現在形 と 進行形","j":"いつものこと・今だけのこと","core":[["現在形（I work）","","いつものこと・変わらない事実"],["進行形（I'm working）","","今まさにしていること・今だけのこと"],["know / like / want / need","","気持ち・状態の動詞。〜ing にしない"]],"ex":[["I usually {work} from home.","ふだんは在宅で[仕事してる]"],["Sorry, {I'm working} right now.","ごめん、今[仕事中]なんだ"],["What {do} you {do}?","お仕事は[何をしてる]んですか？"],["What {are} you {doing}?","今[何してる]の？"],["I {live} in Tokyo, but {I'm staying} in Lisbon this month.","東京に[住んでる]けど、今月はリスボンに[滞在してる]"],["I {know} this song.","この曲、[知ってる]（× I'm knowing）"],["{I'm leaving} tomorrow morning.","明日の朝[出発する]（もう決まっている予定）"]],"pt":["現在形（動詞そのままの形）は「いつものこと・変わらない事実」、進行形（be ＋ 〜ing）は「今まさにしている・今だけのこと」。日本語はどちらも「〜している」になるので注意","What do you do? は「お仕事は？」、What are you doing? は「今何してるの？」。形がちがうと別の質問になる","気持ち・状態の動詞は 〜ing にしない：know, like, want, need, understand, have（持っている）。× I'm knowing him. → ○ I know him.　× I'm having a car. → ○ I have a car.","live は「ずっと住んでいる」、旅先で泊まっているのは be staying：I live in Japan. / I'm staying at a hostel.　be ＋ 〜ing は、もう決まっている近い予定にも使う：I'm leaving tomorrow morning."],"q":[{"p":"I usually ___ coffee in the morning.","o":["drink","am drinking","drinking"],"j":"朝はたいていコーヒーを飲む","w":"いつもの習慣は現在形（usually や every day が目印）"},{"p":"Can I call you back? ___ dinner right now.","o":["I'm eating","I eat","I eating"],"j":"かけ直してもいい？今、夕食を食べてるところ","w":"今まさにしていることは be ＋ 〜ing"},{"p":"I ___ a new SIM card.","o":["need","am needing","needing"],"j":"新しいSIMカードが必要です","w":"need は状態の動詞。〜ing にしない"},{"p":"A: ___  B: I'm a designer.","o":["What do you do?","What are you doing?","What do you doing?"],"j":"A: お仕事は？ B: デザイナーです","w":"仕事（いつものこと）を聞くのは What do you do?"},{"p":"___ at a small hostel in the old town this week.","o":["I'm staying","I stay","I'm stay"],"j":"今週は旧市街の小さなホステルに泊まってる","w":"今だけの一時的なことは be ＋ 〜ing"},{"j":"何を探してるの？","e":"What {are} you {looking} for?"},{"j":"彼のことはよく知ってる","e":"I {know} him well."}]},{"id":"k26","u":2,"t":"過去形 と 現在完了","j":"終わった過去・今につながる過去","core":[["過去形（I went）","","もう終わったこと。「いつ」がはっきりしている"],["have ＋ 過去分詞（I've been）","","今につながっていること（経験・今までずっと・ちょうど今）"],["ever / never","","今までに・一度も〜ない"],["just / already / yet","","ちょうど今・もう・まだ（質問では「もう」）"]],"ex":[["I {went} to Kyoto last year.","去年、京都に[行った]"],["{I've been} to Spain twice.","スペインには2回[行ったことがある]"],["{Have} you {ever tried} Japanese food?","日本食を[食べたことある]？"],["{I've worked} in design for ten years.","デザインの仕事を10年[やってる]"],["{I've just arrived}.","[ちょうど今着いた]ところ"],["{Have} you {eaten} {yet}?","[もう]ごはん[食べた]？"],["{She's gone} to the station.","彼女は駅に[行っちゃった]（今ここにいない）"]],"pt":["「いつ」が終わった時間（yesterday, last week, 〜 ago, in 2020）なら必ず過去形：× I've been there last year. → ○ I went there last year.","have ＋ 過去分詞（go – went – gone の3番目の形）は「今につながっている」こと。経験：Have you ever 〜?（今までに〜したことある？）／ I've never 〜（一度もない）。今までずっと：for ＋ 長さ、since ＋ 始まり","ちょうど今・もう：I've just arrived.（今着いたところ）／ I've already eaten.（もう食べた）／ Not yet.（まだ）。yet は質問と否定の文の最後に置く","have been to は「行ったことがある（もう戻っている）」、have gone to は「行ってしまった（今ここにいない）」。自分の経験を言うときは I've been to 〜"],"q":[{"p":"I ___ to Rome two years ago.","o":["went","have been","have gone"],"j":"2年前にローマに行った","w":"〜 ago は終わった時間なので過去形"},{"p":"Have you ever ___ to Japan?","o":["been","went","go"],"j":"日本に行ったことはある？","w":"「行ったことがある」は have been to 〜"},{"p":"___ this backpack for ten years. I still love it.","o":["I've had","I have","I'm having"],"j":"このバックパックは10年使ってる。今も気に入ってる","w":"今までずっと続いていることは have ＋ 過去分詞（× I have 〜 for ten years）"},{"p":"I haven't booked a hostel ___.","o":["yet","already","ever"],"j":"まだ宿を予約してない","w":"否定の文の「まだ」は、最後に yet"},{"p":"A: Where's your friend?  B: She's ___ to the supermarket. She'll be back soon.","o":["gone","been","went"],"j":"A: 友達はどこ？ B: スーパーに行ってる。すぐ戻るよ","w":"行って今ここにいないのは have gone to。have been to は「行ったことがある」"},{"j":"ここには一度も来たことがない","e":"{I've never been} here."},{"j":"もう昼ごはんは食べたよ","e":"{I've already had} lunch."}]},{"id":"k27","u":2,"t":"will / be going to","j":"今決めた・前から決めてある","core":[["will（I'll）","","今その場で決めたこと・「やるよ」"],["be going to","","前から決めてあること・今にもそうなりそう"],["be ＋ 〜ing","","相手や時間まで決まっている予定"],["won't","","will not（〜しないよ）"]],"ex":[["{I'll} have the pasta.","パスタ[にします]"],["Wait, {I'll} help you.","待って、手伝う[よ]"],["{I'm going to} visit Morocco next month.","来月モロッコに行く[つもり]"],["{I'm meeting} a friend at six.","6時に友達と[会う約束がある]"],["I {won't} be late, I promise.","遅れ[ない]よ、約束する"],["Look at those clouds. {It's going to} rain.","あの雲を見て。雨が降り[そうだ]"],["Don't worry. {It'll} be fine.","心配しないで。[きっと]大丈夫だよ"]],"pt":["will は「今その場で決めた」こと。注文（I'll have 〜）、申し出（I'll help you.）、約束（I'll call you.）。会話ではほぼ I'll と短く言う","be going to は「話す前から決めてある」こと：I'm going to visit Morocco next month.　会話では going to が gonna（ガナ）と聞こえる","相手や時間まで決まっている予定は be ＋ 〜ing：I'm meeting a friend at six.　△ I'll meet a friend at six.（今決めたように聞こえる）","予想にも使う。目の前に証拠があるなら be going to（It's going to rain.）、自分の考えなら will（I think it'll be fine.）。won't は will not の短い形：I won't forget."],"q":[{"p":"A: Are you ready to order?  B: Yes. ___ the chicken, please.","o":["I'll have","I have","I having"],"j":"A: ご注文は決まりましたか？ B: はい。チキンをお願いします","w":"その場で決めた注文は I'll have 〜"},{"p":"A: This bag is so heavy.  B: ___ carry it for you.","o":["I'll","I'm going to","I"],"j":"A: このバッグ、すごく重い。 B: 持ってあげるよ","w":"その場で申し出るときは I'll。be going to は前から決めてあること"},{"p":"I'm ___ visit my friend in Berlin next week.","o":["going to","will","go to"],"j":"来週ベルリンの友達に会いに行くつもり","w":"前から決めてある予定は be going to ＋ 動詞"},{"p":"I can't go out tonight. ___ a client at seven.","o":["I'm meeting","I meeting","I'll meeting"],"j":"今夜は出かけられない。7時にクライアントと会う約束がある","w":"相手や時間が決まっている予定は be ＋ 〜ing"},{"p":"Thanks for everything. I ___ forget this trip.","o":["won't","don't","am not"],"j":"いろいろありがとう。この旅は忘れないよ","w":"これからのこと「〜しないよ」は won't"},{"j":"明日は何をするつもり？","e":"What {are} you {going to} do tomorrow?"},{"j":"あとで電話するね","e":"{I'll} call you later."}]},{"id":"k28","u":2,"t":"can / could / may / might","j":"できる・してもいい？・かもしれない","core":[["can","","できる・してもいい"],["could","","can をやわらかくした形（ていねい）・かもしれない"],["may","","してもよろしい（かたい）・かもしれない"],["might","","かもしれない（会話でいちばんよく使う）"],["can't","","できない・ありえない"]],"ex":[["I {can} speak a little Spanish.","スペイン語を少し話[せる]"],["{Can} I sit here?","ここに座っ[てもいい]？"],["{Could} you say that again?","もう一度言って[もらえますか]？"],["{May} I see your passport?","パスポートを拝見[してもよろしいですか]？"],["I {might} stay one more night.","もう1泊する[かもしれない]"],["It {could} be closed today.","今日は閉まってる[かもしれない]"],["That {can't} be right.","そんな[はずない]"]],"pt":["can は「できる」。否定は can't、過去は could / couldn't：I can't find my key. / I couldn't sleep last night.","許可をもらうときは、ていねいさの順に Can I 〜? ＜ Could I 〜? ＜ May I 〜?。相手にしてもらうときは Can you 〜? ＜ Could you 〜?（May you 〜? とは言わない）","「かもしれない」は might / may / could。会話では might がいちばんふつう：It might rain.　「〜しないかもしれない」は might not","can't は「ありえない・〜のはずがない」にもなる：That can't be right.　聞き分け：can は弱く短く「クン」、can't は強くはっきり「キャン（ト）」"],"q":[{"p":"Can ___ borrow your charger?","o":["I","you","me"],"j":"充電器を借りてもいい？","w":"借りるのは自分なので Can I 〜?。Can you 〜? は相手にしてもらうとき"},{"p":"Take an umbrella. It ___ rain later.","o":["might","can","must"],"j":"傘を持っていって。あとで雨が降るかもしれない","w":"「〜かもしれない」は might（この意味で can は使えない）"},{"p":"Ten euros for a coffee? That ___ be right.","o":["can't","doesn't","isn't"],"j":"コーヒー1杯で10ユーロ？そんなはずない","w":"「ありえない・〜のはずがない」は can't be 〜"},{"p":"___ you speak more slowly, please?","o":["Could","May","Are"],"j":"もう少しゆっくり話してもらえますか？","w":"相手にお願いするのは Could you 〜?（May you 〜? とは言わない）"},{"p":"She can ___ four languages.","o":["speak","speaks","to speak"],"j":"彼女は4つの言語を話せる","w":"can の後ろは動詞の元の形。s も to もつけない"},{"j":"昨日の夜は眠れなかった","e":"I {couldn't} sleep last night."},{"j":"遅れるかもしれない","e":"I {might} be late."}]},{"id":"k29","u":2,"t":"must / have to / should","j":"しなきゃ・したほうがいい・きっと〜だ","core":[["have to","","しなきゃいけない（ルール・事情）"],["must","","絶対に（強い・かたい）／きっと〜にちがいない"],["should","","したほうがいい（アドバイス）"],["don't have to","","しなくていい"],["must not","","してはいけない（禁止）"]],"ex":[["I {have to} get up early tomorrow.","明日は早く起き[なきゃ]"],["You {should} try the local wine.","地元のワインを飲んでみた[ほうがいい]よ"],["You {don't have to} pay now.","今は払わ[なくていい]ですよ"],["You {must not} take photos here.","ここで写真を撮っ[てはいけません]"],["You {must} be tired.","[きっと]疲れてる[でしょう]"],["You {shouldn't} carry so much cash.","そんなに現金を持ち歩か[ないほうがいい]よ"],["{Do} I {have to} book in advance?","前もって予約[しないといけませんか]？"]],"pt":["強さの順：should（したほうがいい）＜ have to（しなきゃ）＜ must（絶対に）。会話の「しなきゃ」はほぼ have to。must はかたく、看板や規則でよく見る","否定にすると意味が大きく変わる：You don't have to pay.（払わなくていい）と You must not pay.（払ってはいけない）は別の意味。must not はかたい言い方で、会話の「〜しちゃダメ」は can't がふつう：You can't smoke here.","アドバイスは should / shouldn't。I think をつけるとやわらかい：I think you should go.　had better は「しないとまずいよ」という警告に聞こえるので、ふつうのアドバイスには should","must には「きっと〜だ」の意味もある：You must be tired.（疲れたでしょう）。過去の「しなきゃいけなかった」は had to（must に過去の形はない）"],"q":[{"p":"The museum is free today. You ___ pay.","o":["don't have to","must not","not have to"],"j":"今日は美術館が無料。払わなくていいよ","w":"「しなくていい」は don't have to。must not だと「払ってはいけない」になる"},{"p":"This is a non-smoking room. You ___ smoke here.","o":["must not","don't have to","don't must"],"j":"ここは禁煙ルームです。ここでタバコを吸ってはいけません","w":"禁止は must not。don't have to だと「吸わなくていい」になる"},{"p":"You haven't eaten all day? You ___ be hungry!","o":["must","can","have"],"j":"一日中何も食べてないの？お腹すいてるでしょう！","w":"「きっと〜にちがいない」は must be 〜"},{"p":"My flight is at six, so I ___ leave the hostel at three.","o":["have to","must to","should to"],"j":"フライトが6時だから、3時に宿を出なきゃ","w":"「しなきゃ」は have to ＋ 動詞。must と should の後ろに to はつけない"},{"p":"It's a great movie. You ___ watch it sometime.","o":["should","had better","must not"],"j":"すごくいい映画だよ。いつか見てみるといいよ","w":"おすすめは should。had better は「見ないとまずいよ」と警告に聞こえる"},{"j":"もう行かなきゃ","e":"I {have to} go now."},{"j":"そんなに心配しないほうがいいよ","e":"You {shouldn't} worry so much."}]},{"id":"k30","u":2,"t":"to する と 〜ing","j":"これからすること・実際にしていること","core":[["to ＋ 動詞","","これからすること（まだしていない）"],["動詞 ＋ ing","","実際にしていること・してきたこと"],["前置詞 ＋ 〜ing","","for / at / before などの後ろは 〜ing"]],"ex":[["I want {to see} the old town.","旧市街を[見]たい"],["I decided {to stay} another night.","もう1泊[する]ことにした"],["I enjoy {meeting} new people.","新しい人と[出会う]のが楽しい"],["Do you mind {waiting} a few minutes?","数分[待って]もらってもいいですか？"],["Thank you for {coming}.","[来てくれて]ありがとう"],["I stopped {drinking} coffee.","コーヒーを[飲む]のをやめた"],["Don't forget {to lock} the door.","ドアに鍵を[かける]のを忘れないで"]],"pt":["to ＋ 動詞は「これからすること」。want / need / hope / decide / plan の後ろは to：I want to go. / I'm planning to stay for a week.","〜ing は「実際にしていること」。enjoy / finish / mind / keep の後ろは 〜ing：I enjoy cooking.（× enjoy to cook）。like / love / start はどちらでもOK","前置詞（for, at, before, after, without, about など）の後ろに動詞を置くときは必ず 〜ing：Thank you for coming. / before leaving / good at cooking","形で意味が変わる動詞：stop smoking（タバコをやめる）と stop to smoke（タバコを吸うために立ち止まる）。remember / forget to 〜 は「これからすることを覚えている・忘れる」：Remember to bring your passport."],"q":[{"p":"We decided ___ a car.","o":["to rent","renting","rent"],"j":"車を借りることにした","w":"decide の後ろは to ＋ 動詞（これからすること）"},{"p":"I really enjoyed ___ with you.","o":["talking","to talk","talk"],"j":"あなたと話せてすごく楽しかった","w":"enjoy の後ろは 〜ing（× enjoy to talk）"},{"p":"Thanks for ___ me.","o":["helping","to help","help"],"j":"手伝ってくれてありがとう","w":"前置詞（for）の後ろは 〜ing"},{"p":"I stopped ___ last year. I feel much better now.","o":["smoking","to smoke","smoke"],"j":"去年タバコをやめた。今はずっと調子がいい","w":"「〜するのをやめる」は stop 〜ing。stop to smoke は「吸うために立ち止まる」"},{"p":"Don't forget ___ your passport.","o":["to bring","bringing","bring"],"j":"パスポートを持ってくるのを忘れないで","w":"これからすることを「忘れないで」は forget to 〜"},{"j":"スマホを充電する必要がある","e":"I need {to charge} my phone."},{"j":"料理は得意じゃない","e":"I'm not good at {cooking}."}]},{"id":"k31","u":2,"t":"受け身（be ＋ 過去分詞）","j":"〜される・〜されている","core":[["is / are ＋ 過去分詞","","〜される・〜されている"],["was / were ＋ 過去分詞","","〜された"],["by 〜","","〜によって（言いたいときだけつける）"]],"ex":[["This wine {is made} in Italy.","このワインはイタリアで[作られてる]"],["This church {was built} in 1500.","この教会は1500年に[建てられた]"],["What {is} this {called} in English?","これは英語で何て[言う]の？"],["The museum {is closed} on Mondays.","美術館は月曜は[閉まってる]"],["My wallet {was stolen}.","財布を[盗まれた]"],["Breakfast {is included}.","朝食[付き]です"],["The tickets {are sold out}.","チケットは[売り切れ]です"]],"pt":["be ＋ 過去分詞（make – made – made、take – took – taken の3番目の形）で「〜される」。今のことは is / are、過去のことは was / were","「だれが」したかは、ふつう言わない（わからない・大事じゃないから）。言いたいときだけ by 〜 をつける：This photo was taken by my friend.","日本語が「〜される」でなくても、英語では受け身になる言い方が多い：売り切れ ＝ is sold out、朝食付き ＝ is included、休み ＝ is closed、中止になった ＝ was canceled、生まれた ＝ was born","よくあるまちがい：× My wallet stolen.（be を忘れない）　× I was stolen my wallet.（盗まれたのは財布）→ ○ My wallet was stolen."],"q":[{"p":"This temple ___ built 400 years ago.","o":["was","is","did"],"j":"このお寺は400年前に建てられた","w":"過去のことなので was ＋ 過去分詞"},{"p":"English ___ in many countries.","o":["is spoken","speaks","is speaking"],"j":"英語は多くの国で話されている","w":"英語は「話される」側なので is spoken"},{"p":"Is breakfast ___ in the price?","o":["included","include","including"],"j":"朝食は料金に含まれていますか？","w":"be ＋ 過去分詞。is included で「含まれている」"},{"p":"___ at the station yesterday.","o":["My bag was stolen","I was stolen my bag","My bag stolen"],"j":"昨日、駅でバッグを盗まれた","w":"盗まれたのはバッグなので、バッグを主語にする（× I was stolen my bag）"},{"p":"Where ___ this made?","o":["was","did","does"],"j":"これはどこで作られたものですか？","w":"受け身の質問は be を前に出す（do / did は使わない）"},{"j":"東京で生まれました","e":"I {was born} in Tokyo."},{"j":"ツアーが中止になった","e":"The tour {was canceled}."}]},{"id":"k32","u":2,"t":"比較（-er / more / the -est）","j":"〜より…・いちばん…・同じくらい…","core":[["-er / more 〜 than","","〜より…（2つをくらべる）"],["the -est / the most 〜","","いちばん…"],["as 〜 as","","同じくらい…"],["better – best ／ worse – worst","","good と bad は形ごと変わる"]],"ex":[["The bus is {cheaper than} the train.","バスは電車[より安い]"],["This hostel is {more expensive than} the last one.","この宿は前の宿[より高い]"],["What's {the best} way to get to the airport?","空港に行く[いちばんいい]方法は？"],["It's {the most beautiful} city I've ever seen.","今まで見た中で[いちばんきれいな]街だ"],["This bag is {much heavier than} mine.","このバッグは私の[よりずっと重い]"],["Tokyo isn't {as cheap as} Bangkok.","東京はバンコク[ほど安く]ない"],["I feel {a bit better} today.","今日は[少しよくなった]"]],"pt":["短い言葉は -er / -est（cheap – cheaper – the cheapest）、長い言葉は more / most（expensive – more expensive – the most expensive）。× more cheap　× expensiver","「〜より」は than、「いちばん」には the をつける。つづり注意：big → bigger、easy → easier。good – better – best、bad – worse – worst は形ごと変わる","as 〜 as は「同じくらい」、not as 〜 as は「…ほど〜ない」：It's not as cold as yesterday.","差の大きさは前に置く：a bit / a little（少し）、much / a lot（ずっと）。× very bigger → ○ much bigger"],"q":[{"p":"Flying is ___ than taking the train.","o":["more expensive","expensiver","most expensive"],"j":"飛行機は電車より高い","w":"長い言葉は more に始めてて","w":"遅れるかどうかわからないので if。when は必ず起きること"},{"p":"I always charge my phone before ___ the hotel.","o":["leaving","leave","to leave"],"j":"ホテルを出る前に、いつもスマホを充電する","w":"before / after のすぐ後ろに動詞を置くなら -ing"},{"p":"Let's wait here until the rain ___.","o":["stops","will stop","stopped"],"j":"雨がやむまでここで待とう","w":"until の後ろも、未来の話は現在形"},{"j":"ホテルに着いたらすぐ電話するね","e":"I'll call you {as soon as} I get to the hotel."},{"j":"準備ができたら教えて","e":"Let me know {when} you're ready."}]},{"id":"k36","u":3,"t":"who / which / that / where（後ろから説明する）","j":"名詞を先に言って、説明は後ろに足す","core":[["who","","人を後ろから説明する（〜する人）"],["that / which","","物を後ろから説明する（〜する物）"],["where","","場所を後ろから説明する（そこで〜する場所）"],["what","","〜なこと・もの"]],"ex":[["I met a guy {who works here}.","[ここで働いてる]人に会った"],["Is there a bus {that goes to the airport}?","[空港に行く]バスはありますか？"],["This is the hotel {I booked}.","これが[私が予約した]ホテル（that を省略した形）"],["I'm looking for a place {where I can work}.","[仕事ができる]場所を探してる"],["The café {near the station} is nice.","[駅の近くの]カフェがいいよ"],["Who's the man {sitting over there}?","[あそこに座ってる]男の人は誰？"],["That's {what I want}.","それが[私のほしいもの]"]],"pt":["日本語は説明を名詞の前に置く（駅の近くのカフェ）。英語はまず名詞を言って、説明を後ろに足す（the café near the station）","説明が文のときは、人なら who、物なら that、場所なら where でつなぐ：a friend who lives in Paris / a train that leaves at nine / a café where you can work。which は that と同じ意味で、会話では that がふつう","that のすぐ後ろが「誰が」なら that は省略できる：the hotel (that) I booked。すぐ後ろが動詞なら省略できない：a bus that goes to the airport","短い説明も後ろに置く：something to eat（何か食べるもの）、the man sitting there（そこに座ってる人）。what は「〜なこと・もの」：That's what I want."],"q":[{"p":"I have a friend ___ lives in Berlin.","o":["who","which","where"],"j":"ベルリンに住んでる友達がいる","w":"人を後ろから説明するのは who"},{"p":"I'm looking for a shop ___ sells SIM cards.","o":["that","where","what"],"j":"SIMカードを売ってる店を探してる","w":"すぐ後ろが動詞（sells）なので that。where の後ろには「誰が」が必要"},{"p":"Do you know a quiet café ___ I can work?","o":["where","which","who"],"j":"仕事ができる静かなカフェを知ってる？","w":"「そこで〜できる場所」は where"},{"p":"This is the photo ___ yesterday.","o":["I took","I took it","what I took"],"j":"これが昨日撮った写真","w":"the photo (that) I took。that は省略できる。説明の中に it は入れない"},{"p":"This is exactly ___ I wanted.","o":["what","that","which"],"j":"これ、まさにほしかったもの","w":"「〜なもの」は what（what I wanted ＝ 私がほしかったもの）"},{"j":"窓のそばに立ってる女の人は誰？","e":"Who's the woman {standing by the window}?"},{"j":"電車で読むものが何かほしい","e":"I want something {to read} on the train."}]},{"id":"k37","u":3,"t":"質問の作り方（語順）","j":"be・do・can を前に出すと質問になる","core":[["Are you 〜? / Can you 〜?","","be・can を文の頭に出す"],["Do you 〜?","","ふつうの動詞は Do を頭に足す"],["Where do you 〜?","","聞きたい言葉（what / where など）を一番前に"],["Who made 〜?","","「誰が・何が」を聞くときは do なし"],["Do you know where 〜 is?","","文の中に入れたら、ふつうの順番に戻る"]],"ex":[["{Is} this seat free?","この席、空いてますか？（This seat is 〜 の is を前に出す）"],["{Do} you have Wi-Fi?","Wi-Fiはありますか？（You have 〜 の頭に Do を足す）"],["{Where do} you live?","[どこに]住んでるの？"],["{Who} made this?","[誰が]これを作ったの？（「誰が」を聞くときは do なし）"],["Do you know {where the station is}?","[駅がどこにあるか]知ってますか？（where is the station の順にしない）"],["Can you tell me {what time it opens}?","[何時に開くか]教えてもらえますか？"],["Who are you traveling {with}?","誰[と]旅してるの？"]],"pt":["Yes / No で答える質問は、be（am / is / are）や can を文の頭に出す：You are tired. → Are you tired?　ふつうの動詞のときは do / does / did を頭に足す：Do you like it?","what / where / when / how などは一番前に置き、後ろは質問の順番のまま：Where do you live?　× Where you live?","「誰が・何が」を聞くときは do を使わず、すぐ動詞を言う：Who made this? / What happened?　× Who did make this?","質問を文の中に入れると、ふつうの順番に戻る：Where is the station? → Do you know where the station is?　with / from / for は文の最後に残す：Where are you from? / What are you looking for?"],"q":[{"p":"___ this train go to Vienna?","o":["Does","Is","Do"],"j":"この電車はウィーンに行きますか？","w":"ふつうの動詞（go）の質問は do / does を頭に。this train は1つなので does"},{"p":"Where ___ yesterday?","o":["did you go","you went","did you went"],"j":"昨日どこに行ったの？","w":"where の後ろは did you ＋ 動詞のもとの形"},{"p":"Who ___ this photo?","o":["took","did take","did took"],"j":"誰がこの写真を撮ったの？","w":"「誰が」を聞くときは do / did を使わない"},{"p":"Do you know ___?","o":["where the bathroom is","where is the bathroom","where the bathroom"],"j":"トイレがどこにあるか知ってますか？","w":"文の中に入れたら、ふつうの順番（the bathroom is）に戻す"},{"p":"Who are you waiting ___?","o":["for","（なし）","to"],"j":"誰を待ってるの？","w":"wait for の for は文の最後に残る"},{"j":"何があったの？","e":"{What happened}?"},{"j":"何時に閉まるか知ってますか？","e":"Do you know {what time it closes}?"}]},{"id":"k38","u":3,"t":"always / usually / often / sometimes / never（頻度）","j":"どれくらいよくするか（いつも → まったく〜ない）","core":[["always","","いつも（100%）"],["usually","","たいてい（80%くらい）"],["often","","よく（60%くらい）"],["sometimes","","ときどき（30%くらい）"],["never","","まったく〜ない（0%）"]],"ex":[["I {usually} go to bed around eleven.","[たいてい]11時ごろ寝る"],["He's {always} late.","彼は[いつも]遅刻する"],["I {often} work at cafés.","[よく]カフェで仕事する"],["{Sometimes} I cook at the hostel.","[ときどき]宿で自炊する"],["I {never} drink coffee at night.","夜はコーヒーを[絶対]飲ま[ない]"],["I call my family {once a week}.","[週に1回]家族に電話する"],["{How often} do you travel?","[どれくらいよく]旅行するの？"]],"pt":["置く場所は「ふつうの動詞の前、be の後ろ」：○ I usually eat breakfast.　× I eat usually breakfast.　○ I'm always tired.　× I always tired.","sometimes は文の最初や最後にも置ける（Sometimes I cook. / I cook sometimes.）。every day / once a week / twice a month のような言い方は文の最後に置く","never はそれだけで「〜ない」。not と一緒に使わない：○ I never eat meat.　× I don't never eat meat.　hardly ever は「めったに〜ない」で、これも not なし","回数を聞くのは How often 〜? で、答えは once（1回）/ twice（2回）/ three times（3回）＋ a week / a month：How often do you cook? — Twice a week."],"q":[{"p":"I ___ breakfast.","o":["never eat","don't never eat","eat never"],"j":"朝食はまったく食べない","w":"never はそれだけで否定。ふつうの動詞の前に置く"},{"p":"___ tired after a long flight.","o":["I'm always","I always","Always I'm"],"j":"長いフライトのあとはいつも疲れてる","w":"be（am）の後ろに always。be を抜かさない"},{"p":"I ___.","o":["do laundry twice a week","twice a week do laundry","do twice a week laundry"],"j":"週に2回洗濯する","w":"twice a week のような回数は文の最後"},{"p":"A: ___ do you go back to Japan?  B: About once a year.","o":["How often","How many","How long"],"j":"A: どれくらいの頻度で日本に帰るの？ B: 年に1回くらい","w":"回数・頻度を聞くのは How often"},{"p":"I ___ eat out. It's too expensive here.","o":["hardly ever","hardly never","ever hardly"],"j":"めったに外食しない。ここは高すぎる","w":"hardly ever ＝ めったに〜ない（never の少し手前）"},{"j":"たいてい歩いて仕事に行く","e":"I {usually} walk to work."},{"j":"ときどき日本食が恋しくなる","e":"{Sometimes} I miss Japanese food."}]},{"id":"k39","u":3,"t":"語順のきほん","j":"誰が → どうする → 何を → どこで → いつ","core":[["誰が → どうする → 何を","","英語は順番で意味が決まる"],["どこで → いつ","","場所が先、時間はあと"],["I / it","","主語は必ず言う（日本語で言わなくても）"],["give ＋ 人 ＋ 物","","「誰に」は「何を」の前"]],"ex":[["I went {to the market} {yesterday}.","[昨日]、[市場に]行った（場所 → 時間の順）"],["I had {dinner} {at the hostel} {last night}.","[昨日の夜]、[宿で][夕食を]食べた（何を → どこで → いつ）"],["{It}'s cold today.","今日は寒いね（日本語に主語がなくても it を置く）"],["I like this city {very much}.","この街が[とても]好き"],["She speaks English {well}.","彼女は英語を[上手に]話す"],["I gave {the driver} {ten euros}.","[運転手に][10ユーロ]渡した"],["I {also} speak a little Spanish.","スペイン語[も]少し話せます"]],"pt":["英語は順番で意味が決まる。誰が → どうする →（誰に）→ 何を → どこで → いつ。日本語の「が・を・に」の役目を、英語では順番がしている","場所が先、時間はあと（at the hostel → last night）。主語は必ず言う。日本語で言わなくても I や it を置く：○ It's hot today.　× Is hot today.","very much / well は文の最後：○ I like coffee very much.　× I like very much coffee.　○ She speaks English well.　× She speaks well English.　形容詞は名詞の前で、感想（nice）が先、大きさ（small）があと：a nice small room","give ＋ 人 ＋ 物 ＝ give ＋ 物 ＋ to ＋ 人：Give me the key. ＝ Give the key to me.　also / just / only はふつうの動詞の前、be の後ろ：I also like it. / I'm just looking."],"q":[{"p":"I ___.","o":["went to the museum yesterday","went yesterday to the museum","yesterday went to the museum"],"j":"昨日美術館に行った","w":"場所 → 時間の順。動詞と場所は離さない"},{"p":"___ very hot today.","o":["It's","Is","It"],"j":"今日はすごく暑い","w":"英語は主語が必要。天気は It's 〜（It is 〜）で言う"},{"p":"I like ___.","o":["Japanese food very much","very much Japanese food","Japanese food very"],"j":"日本食がとても好きです","w":"very much は文の最後。動詞と「何を」は離さない"},{"p":"Can you give ___?","o":["me your number","your number me","to me your number"],"j":"番号を教えてくれる？","w":"give ＋ 人 ＋ 物。物を先に言うなら give your number to me"},{"p":"It's ___.","o":["a nice small room","a room nice small","a nice room small"],"j":"いい感じの小さな部屋だね","w":"形容詞は名詞の前に並べる"},{"j":"現金しか持ってない","e":"I {only} have cash."},{"j":"来週ローマで友達に会う","e":"I'm meeting {a friend} {in Rome} {next week}."}]},{"id":"k40","u":4,"t":"say / tell / speak / talk","j":"言葉を言う・人に伝える・言語を話す・会話する","core":[["say","","言葉を口に出す（後ろは言った言葉）"],["tell","","人に内容を伝える（後ろは人）"],["speak","","声に出して話す（言語・あらたまった場面）"],["talk","","相手とやりとりして話す（会話）"]],"ex":[["How do you {say} this in English?","これは英語で何て[言う]の？"],["Can you {tell} me the way to the station?","駅までの道を[教えて]くれる？"],["Does anyone here {speak} English?","ここに英語を[話せる]人はいますか？"],["We {talked} about our trips for hours.","お互いの旅について何時間も[話した]"],["She {said} hello to everyone.","彼女はみんなに[あいさつした]"],["{Tell} him I'll be a little late.","少し遅れるって彼に[伝えて]"],["Can I {speak} to the manager?","店長と[話せ]ますか？"]],"pt":["say の後ろは「言った言葉・内容」：say hello / say thank you / say yes。人を入れるなら to をつける：say hello to him（× say me 〜）","tell の後ろはすぐ「人」：tell me / tell him the way。× She told that 〜 → ○ She told me that 〜。tell the truth（本当のことを言う）は人なしでも言える","speak は言語（speak English）や、あらたまった場面（Can I speak to the manager?）。talk は気楽な会話：talk to / with 人、talk about 話題","「〜は英語で何て言う？」は How do you say 〜 in English?（× How to say 〜? / × How do you speak 〜?）"],"q":[{"p":"How do you ___ 'thank you' in Italian?","o":["say","tell","speak"],"j":"「ありがとう」はイタリア語で何て言うの？","w":"言葉そのものを口に出すのは say"},{"p":"Can you ___ me your name again?","o":["tell","say","speak"],"j":"もう一度名前を教えてくれる？","w":"すぐ後ろに「人」が来るのは tell（× say me）"},{"p":"Sorry, I don't ___ French.","o":["speak","talk","say"],"j":"すみません、フランス語は話せません","w":"言語を話すのは speak"},{"p":"I ___ to my family on the phone last night.","o":["talked","told","said"],"j":"昨日の夜、家族と電話で話した","w":"会話するのは talk to 人。tell は to なしで人が続く"},{"p":"She ___ that the museum is closed today.","o":["told me","told","said me"],"j":"今日は美術館が閉まってると彼女が教えてくれた","w":"tell のすぐ後ろには人が必要（× told that / × said me）"},{"j":"彼は何て言ったの？","e":"What did he {say}?"},{"j":"もっとゆっくり話してくれる？","e":"Can you {speak} more slowly?"}]},{"id":"k41","u":4,"t":"see / look / watch ・ hear / listen","j":"目に入る・目を向ける・じっと見る／耳に入る・耳をかたむける","core":[["see","","自然に目に入る・人に会う"],["look at","","自分から目を向ける"],["watch","","動くものをしばらく見つづける"],["hear","","自然に耳に入る"],["listen to","","自分から耳をかたむける"]],"ex":[["{Look at} this!","これ[見て]！"],["You can {see} the whole city from here.","ここから街全体が[見える]よ"],["Let's {watch} the sunset from the beach.","ビーチから夕日を[見よう]"],["Sorry, I can't {hear} you.","ごめん、[聞こえ]ない"],["I always {listen to} music on the train.","電車ではいつも音楽を[聞いてる]"],["Do you want to {see} a movie tonight?","今夜、映画を[見に行か]ない？"],["Nice to {see} you again!","また[会えて]うれしい！"]],"pt":["see / hear は「自然に入ってくる」。look / listen は「自分から目や耳を向ける」。watch は「動くものをしばらく見つづける」","look には at、listen には to が必要：× Look this. → ○ Look at this. / × I listen music. → ○ I listen to music.","「見える・聞こえる」は can をつける：I can see the sea.（海が見える）/ I can't hear you.（聞こえない）","テレビ・試合・動画は watch。映画は家なら watch a movie、映画館なら see a movie もよく言う。「人に会う」も see：See you later."],"q":[{"p":"___ at that building! It's beautiful.","o":["Look","See","Watch"],"j":"あの建物を見て！きれいだね","w":"目を向けるのは look at。see / watch に at はつかない"},{"p":"Can you speak up? I can't ___ you.","o":["hear","listen"],"j":"もっと大きな声で話してくれる？聞こえない","w":"聞こえる（耳に入ってくる）のは hear。listen は自分から耳をかたむけること"},{"p":"I ___ soccer on TV every weekend.","o":["watch","look","see"],"j":"毎週末テレビでサッカーを見る","w":"試合・テレビなど動くものを見つづけるのは watch。毎週の習慣には see を使わない"},{"p":"I like to ___ podcasts when I walk.","o":["listen to","hear","listen"],"j":"歩くときはポッドキャストを聞くのが好き","w":"自分から耳をかたむけるのは listen to（to を忘れない）"},{"p":"Did you ___ my message?","o":["see","look","watch"],"j":"私のメッセージ見た？","w":"目に入った・気づいたは see。look は at が必要"},{"j":"何も見えない","e":"I can't {see} anything."},{"j":"この曲を聞いて","e":"{Listen to} this song."}]},{"id":"k42","u":4,"t":"come / go ・ bring / take","j":"自分か相手のほうへ近づく・そこから離れる","core":[["come","","自分か相手のいる所（これから行く所も）へ近づく"],["go","","そこから離れて別の場所へ"],["bring","","自分か相手のいる所へ持ってくる・持っていく"],["take","","別の場所へ持っていく・連れていく"]],"ex":[["A: Dinner's ready!  B: I'm {coming}!","A: ごはんできたよ！ B: 今[行く]！"],["Can I {come} with you?","一緒に[行って]もいい？"],["I'm {going} to the supermarket. Do you need anything?","スーパーに[行く]けど、何かいる？"],["Can you {bring} me some water?","水を[持ってきて]くれる？"],["I'll {bring} some wine to your party.","君のパーティーにワインを[持っていく]ね"],["{Take} an umbrella. It's going to rain.","傘を[持っていって]。雨が降るよ"],["I'll {take} you to the station.","駅まで[送って]いくよ"]],"pt":["日本語の「行く／来る」とはずれる。相手のいる所や、相手がこれから行く場所へ向かうなら、日本語が「行く」でも come","呼ばれて「今行く！」は I'm coming!。I'm going! だと「（別の所へ）出かけるね」に聞こえる","bring / take も同じ考え方。相手のいる所・相手が行く場所へ持っていくのは bring、そこから離れた別の場所へは take","take 人 to 場所 で「連れていく・送る」：I'll take you to the airport.（× send you）。send は荷物やメッセージを送るとき"],"q":[{"p":"A: Where are you? We're all waiting.  B: Sorry! I'm ___ now.","o":["coming","going"],"j":"A: どこにいるの？みんな待ってるよ。 B: ごめん！今行く","w":"相手のいる所へ向かうので come。日本語は「行く」でも I'm coming"},{"p":"See you at your place tonight. I'll ___ some beer.","o":["bring","take","carry"],"j":"今夜、君の家でね。ビールを持っていくよ","w":"相手のいる場所へ持っていくのは bring"},{"p":"A: Have you been to Spain?  B: Yes, I ___ there last summer.","o":["went","came"],"j":"A: スペインに行ったことある？ B: うん、去年の夏に行ったよ","w":"自分も相手もいない場所（there）へは go"},{"p":"Can you ___ me to the airport tomorrow morning?","o":["take","send","go"],"j":"明日の朝、空港まで送ってくれる？","w":"人を送っていくのは take 人 to 場所。send は物を送るとき"},{"p":"Excuse me, can you ___ us the menu?","o":["bring","take","come"],"j":"すみません、メニューを持ってきてもらえますか？","w":"話している人の所へ持ってくるのは bring"},{"j":"パスポートを持ってきてください","e":"Please {bring} your passport."},{"j":"ホテルまで送っていくよ","e":"I'll {take} you to the hotel."}]},{"id":"k43","u":4,"t":"get","j":"手に入れる・着く・〜になる・わかる","core":[["get ＋ 物","","手に入れる（買う・もらう・受け取る）"],["get to ＋ 場所","","着く"],["get ＋ ようすの言葉","","〜になる（get tired / get dark）"],["I get it.","","わかった"]],"ex":[["Where can I {get} a ticket?","チケットはどこで[買え]ますか？"],["Can I {get} the check, please?","お会計を[もらえ]ますか？"],["What time do we {get to} the hotel?","ホテルには何時に[着く]の？"],["I {got} lost in the old town.","旧市街で道に[迷った]"],["It's {getting} dark.","暗く[なってきた]"],["Oh, I {get} it!","あ、[わかった]！"],["I {got} your message.","メッセージ、[受け取った]よ"]],"pt":["get のコアは「ない状態から、ある状態になる」。物なら「手に入れる」、場所なら「着く」、ようすなら「〜になる」、話なら「わかる」","着く：get to the hotel / get to the airport。home・here・there には to をつけない：get home / get there（× get to home）","〜になる：get tired（疲れる）、get hungry（お腹がすく）、get dark（暗くなる）、get lost（道に迷う）、get better（よくなる）","かたまりで覚える：get on / get off（乗る／降りる）、get up（起きる）、get back（戻る）、I don't get it.（わからない）"],"q":[{"p":"What time did you ___ home last night?","o":["get","get to","arrive to"],"j":"昨日の夜は何時に家に着いたの？","w":"home には to をつけない：get home"},{"p":"How do I ___ the airport from here?","o":["get to","get","arrive"],"j":"ここから空港へはどう行けばいい？","w":"場所に着く・たどり着くは get to ＋ 場所"},{"p":"Let's go back. It's ___ cold.","o":["getting","coming","making"],"j":"戻ろう。寒くなってきた","w":"「〜になる」は get ＋ ようすの言葉"},{"p":"That joke was too hard for me. I didn't ___ it.","o":["get","take","have"],"j":"あのジョークは私には難しすぎた。わからなかった","w":"get it ＝ わかる。I don't get it.（わからない）"},{"p":"I'll message you when I get ___ to the hostel.","o":["back","on","off"],"j":"宿に戻ったら連絡するね","w":"get back ＝ 戻る"},{"j":"お腹がすいてきた","e":"I'm {getting} hungry."},{"j":"SIMカードはどこで手に入りますか？","e":"Where can I {get} a SIM card?"}]},{"id":"k44","u":4,"t":"have / take / make / do","j":"「〜する」は名詞ごとに決まった動詞と組む","core":[["have","","食事・体験・体調（have lunch / a good time / a cold）"],["take","","シャワー・写真・休憩・乗り物・薬・時間（take a shower / a photo）"],["make","","新しく作り出すもの（make a reservation / a mistake / friends）"],["do","","決まった作業（do laundry / homework / the dishes）"]],"ex":[["Let's {have} lunch together.","一緒に昼ごはんを[食べよう]"],["Can I {take} a shower now?","今シャワーを[浴びて]もいい？"],["I'd like to {make} a reservation for two.","2名で予約を[取り]たいのですが"],["I need to {do} laundry today.","今日は洗濯を[し]ないと"],["It {takes} 40 minutes to get to the airport.","空港まで40分[かかる]"],["I {made} a lot of friends on this trip.","この旅で友達がたくさん[できた]"],["I {had} a great time tonight.","今夜はすごく[楽しかった]"]],"pt":["日本語の「する」をそのまま do にしない。名詞ごとに組む動詞が決まっているので、セットで覚える","make は「新しく作り出す」：make a reservation / a mistake / a plan / a call / friends / money。do は「決まった作業をこなす」：do laundry / homework / the dishes / business / my best","have は食事・体験・体調：have lunch / have a good time / have a look（ちょっと見る。take a look とも言う）/ have a cold（かぜをひいている）","take は take a shower / a photo / a break / the bus / medicine（薬を飲む。× drink medicine）。「時間がかかる」は It takes ＋ 時間"],"q":[{"p":"I ___ a mistake. Sorry about that.","o":["made","did","took"],"j":"間違えました。すみません","w":"間違いは「作り出す」ので make a mistake（× do a mistake）"},{"p":"Did you ___ your medicine this morning?","o":["take","drink","eat"],"j":"今朝、薬は飲んだ？","w":"薬を「飲む」は take medicine（× drink）"},{"p":"I'll ___ the dishes tonight. You cooked.","o":["do","make","have"],"j":"今夜は私が皿を洗うよ。料理してくれたから","w":"皿洗い・洗濯など決まった作業は do"},{"p":"I ___ a cold, so I'm staying in today.","o":["have","take","do"],"j":"かぜをひいているので、今日は出かけない","w":"体調・病気は have（have a cold / a headache）"},{"p":"Let's ___ a plan for tomorrow.","o":["make","do","take"],"j":"明日の計画を立てよう","w":"計画は「作り出す」ので make a plan"},{"j":"休憩しよう","e":"Let's {take} a break."},{"j":"ベストをつくします","e":"I'll {do} my best."}]},{"id":"k45","u":4,"t":"borrow / lend / rent ・ teach / tell / show","j":"借りる・貸す・お金を払って借りる／3つの「教える」","core":[["borrow","","ただで借りて持っていく"],["lend","","しばらく貸す"],["rent","","お金を払って借りる"],["teach","","技術・科目を教える"],["tell / show","","情報を言葉で教える／見せて教える"]],"ex":[["Can I {borrow} your pen?","ペンを[借りて]もいい？"],["Can you {lend} me your charger?","充電器を[貸して]くれる？"],["I want to {rent} a bike for a day.","1日、自転車を[借り]たい"],["Can I {use} your Wi-Fi?","Wi-Fiを[借りて]もいい？"],["Can you {tell} me your email address?","メールアドレスを[教えて]くれる？"],["Can you {show} me how to use this machine?","この機械の使い方を[教えて]くれる？"],["My friend {taught} me how to surf.","友達がサーフィンを[教えて]くれた"]],"pt":["borrow は自分が「借りる」、lend は相手が「貸す」。Can I borrow your pen? ＝ Can you lend me your pen?（× Can you borrow me 〜?）","お金を払って借りるのは rent：rent a car / rent a bike / rent an apartment","トイレやWi-Fiのように、その場で使うだけのものは use：Can I use the bathroom?（× borrow the bathroom）","「教える」は3つ。teach は技術や科目（teach English）、tell は情報（道・名前・番号）、show は実際に見せる（show me how）。× Teach me your name. → ○ Tell me your name."],"q":[{"p":"Can I ___ your umbrella? I'll bring it back tomorrow.","o":["borrow","lend","rent"],"j":"傘を借りてもいい？明日返すから","w":"自分がただで借りるのは borrow。lend は「貸す」、rent はお金を払って借りるとき"},{"p":"Can you ___ me ten euros? I'll pay you back tonight.","o":["lend","borrow","rent"],"j":"10ユーロ貸してくれる？今夜返すから","w":"相手が貸すのは lend 人 物"},{"p":"We ___ a car for 40 euros a day.","o":["rented","borrowed","lent"],"j":"1日40ユーロで車を借りた","w":"お金を払って借りるのは rent"},{"p":"Can you ___ me where the bus stop is?","o":["tell","teach","say"],"j":"バス停がどこにあるか教えてくれる？","w":"情報を教えるのは tell。teach は技術や科目"},{"p":"I can't find it. Can you ___ me on the map?","o":["show","teach","say"],"j":"見つからない。地図で教えてくれる？","w":"見せながら教えるのは show"},{"j":"トイレを借りてもいいですか？","e":"Can I {use} the bathroom?"},{"j":"日本語を少し教えてあげるよ","e":"I'll {teach} you some Japanese."}]},{"id":"k46","u":4,"t":"know / meet ・ live / stay ・ wear / put on","j":"知っている・出会う／住む・泊まる／着ている・着る","core":[["know","","もう知っている（状態）"],["meet","","初めて会う・待ち合わせて会う"],["live / stay","","家がある／一時的に泊まる"],["wear","","身につけている（状態）"],["put on","","身につける（動作）"]],"ex":[["Do you {know} each other?","お互い[知り合い]なの？"],["We {met} at a hostel in Lisbon.","リスボンのホステルで[出会った]"],["Let's {meet up} for dinner tonight.","今夜[会って]夕食を食べよう"],["I {live} in Tokyo, but I'm {staying} at a hostel here.","東京に[住んでる]けど、ここではホステルに[泊まってる]"],["She's {wearing} a red jacket.","彼女は赤いジャケットを[着てる]"],["{Put on} your jacket. It's cold outside.","上着を[着て]。外は寒いよ"],["I want to {get to know} the people here.","ここの人たちのことをもっと[知り]たい"]],"pt":["know は「もう知っている」状態。初めて会う・知り合うのは meet、だんだん知っていくのは get to know、情報を新しく知るのは find out","「パリで彼女と知り合った」は I met her in Paris.（× I knew her in Paris.）。待ち合わせて会うのも meet / meet up","live は家がある場所、stay は旅先などの一時的な場所。旅行中は I'm staying at a hostel.（× I'm living at a hostel.）","wear は「身につけている」状態、put on は「身につける」動作。「メガネをかけている」は I'm wearing glasses.（I'm putting on glasses. は、今かけている最中）"],"q":[{"p":"We ___ at a hostel in Peru two years ago, and we're still friends.","o":["met","knew","have known"],"j":"2年前にペルーのホステルで出会って、今も友達","w":"初めて会う・知り合うのは meet。know は「もう知っている」状態"},{"p":"A: Where are you ___ in Bangkok?  B: At a guesthouse by the river. Just for three nights.","o":["staying","living","stay"],"j":"A: バンコクではどこに泊まってるの？ B: 川のそばのゲストハウス。3泊だけ","w":"旅先の一時的な宿は stay"},{"p":"My parents still ___ in Osaka, where I grew up.","o":["live","stay","living"],"j":"両親は今も、私が育った大阪に住んでる","w":"家がある場所は live。stay は一時的な滞在"},{"p":"It was so cold that I ___ my jacket all day.","o":["wore","put on","took off"],"j":"すごく寒くて、一日中ジャケットを着ていた","w":"ずっと着ている状態は wear。put on は着る動作"},{"p":"I quickly ___ my shoes and ran to the bus stop.","o":["put on","wore","dressed"],"j":"急いで靴をはいて、バス停まで走った","w":"身につける動作は put on。wear は身につけている状態"},{"j":"はじめまして","e":"Nice to {meet} you."},{"j":"彼のこと知ってる？","e":"Do you {know} him?"}]},{"id":"k47","u":4,"t":"look / sound / feel / seem ＋ 形容詞","j":"〜に見える・〜に聞こえる・〜と感じる・〜のようだ","core":[["look","","見た感じ、〜だ"],["sound","","聞いた感じ、〜だ"],["feel","","体や心で〜と感じる"],["taste / smell","","〜な味がする／〜なにおいがする"],["seem","","全体の印象として〜のようだ"]],"ex":[["You {look} tired. Are you okay?","疲れてる[ように見える]よ。大丈夫？"],["That {sounds} fun!","それ、楽し[そう]！"],["I {feel} much better today.","今日はだいぶ[気分]がいい"],["This {smells} so good!","これ、すごくいい[におい]！"],["He {seems} really nice.","彼はすごくいい人[みたいだ]"],["It {looks like} rain.","雨が降り[そうだ]"],["I {feel like} eating something spicy.","何か辛いものを食べ[たい気分]"]],"pt":["look（見た感じ）・sound（聞いた感じ）・feel（体や心の感じ）・taste（味）・smell（におい）・seem（全体の印象）の後ろに、ようすを表す言葉（形容詞）を置く","後ろは形容詞。well や nicely のような副詞（動きを説明する言葉）は使わない：× It looks well. → ○ It looks good. / × It tastes well. → ○ It tastes good.（体調が「元気だ」の意味の well だけは別：I don't feel well.）","名詞を続けるときは like をはさむ：It looks like rain.（雨になりそう）/ Sounds like a plan.（いいね、そうしよう）/ It tastes like chicken.（鶏肉みたいな味）","feel like ＋ 名詞／〜ing は「〜したい気分」：I feel like a beer.（ビールが飲みたい気分）/ I don't feel like cooking.（料理する気分じゃない）"],"q":[{"p":"A: Let's go to the beach tomorrow.  B: That ___ perfect!","o":["sounds","looks","hears"],"j":"A: 明日ビーチに行こう。 B: 最高だね！","w":"聞いた話への感想は sound"},{"p":"This pizza ___ really good. Where did you buy it?","o":["looks","looks like","sees"],"j":"このピザ、すごくおいしそう。どこで買ったの？","w":"後ろが形容詞なら like はいらない。look ＋ 形容詞"},{"p":"This curry tastes ___.","o":["good","well","nicely"],"j":"このカレー、おいしい","w":"taste の後ろは形容詞（good）。副詞（well / nicely）は使わない"},{"p":"What's that noise? It sounds ___ a party.","o":["like","as","（なし）"],"j":"あの音は何？パーティーみたいだね","w":"後ろが名詞（a party）なら like をはさむ"},{"p":"I'm tired. I don't feel like ___ out tonight.","o":["going","to go","go"],"j":"疲れた。今夜は出かける気分じゃない","w":"feel like の後ろは 〜ing"},{"j":"うれしそうだね","e":"You {look} happy."},{"j":"今日は気分がいい","e":"I {feel} good today."}]},{"id":"k48","u":4,"t":"-ed と -ing（bored / boring）","j":"-ed は人の気持ち・-ing は物やことのようす","core":[["-ed（bored / tired / excited）","","人が「そう感じている」"],["-ing（boring / tiring / exciting）","","物やことが「そう感じさせる」"],["interested in 〜","","〜に興味がある"]],"ex":[["I'm {bored}. Let's go out.","[たいくつ]だ。出かけよう"],["The movie was {boring}.","その映画は[つまらなかった]"],["I'm so {excited} about the trip!","旅行がすごく[楽しみ]！"],["It was a long, {tiring} flight.","長くて[疲れる]フライトだった"],["I'm {interested} in old buildings.","古い建物に[興味がある]"],["Sorry, I'm {confused}. Can you say that again?","ごめん、[わからなくなった]。もう一度言ってくれる？"],["The hot spring was really {relaxing}.","温泉はすごく[リラックスできた]"]],"pt":["-ed は「人の気持ち」、-ing は「そう感じさせる物・こと」。I'm bored.（私はたいくつしている）/ The movie is boring.（映画がつまらない）","× I'm boring. は「私はつまらない人間です」の意味になる。気持ちを言うときは -ed：I'm bored. / I'm excited. / I'm tired.","ペアで覚える：interested / interesting、surprised / surprising、confused / confusing、relaxed / relaxing、annoyed / annoying、disappointed / disappointing","「〜に興味がある」は interested in 〜：I'm interested in design.（× I'm interesting in design.）"],"q":[{"p":"I have nothing to do. I'm so ___.","o":["bored","boring","bore"],"j":"することがない。すごくたいくつ","w":"自分の気持ちは -ed。I'm boring. だと「私はつまらない人」になる"},{"p":"I'm ___ in learning Spanish.","o":["interested","interesting","interest"],"j":"スペイン語を学ぶことに興味がある","w":"人の気持ちは -ed。interested in 〜"},{"p":"The directions were ___, so we got lost.","o":["confusing","confused","confuse"],"j":"道案内がわかりにくくて、迷った","w":"物（道案内）が人を混乱させるので -ing"},{"p":"I was ___ to see him there.","o":["surprised","surprising","surprise"],"j":"そこで彼に会ってびっくりした","w":"びっくりしたのは自分の気持ちなので -ed"},{"p":"The noise from the street is really ___.","o":["annoying","annoyed","annoy"],"j":"通りの騒音が本当にうっとうしい","w":"物・ことが人をイライラさせるので -ing"},{"j":"ちょっとがっかりしてる","e":"I'm a little {disappointed}."},{"j":"この本はおもしろい","e":"This book is {interesting}."}]},{"id":"k49","u":5,"t":"句動詞①：身のまわりの動き","j":"動詞＋小さい言葉で、毎日の動作を言う","core":[["wake up / get up","","目が覚める／起き上がる"],["put on / take off","","身につける／脱ぐ"],["turn on / turn off","","（電気・機械を）つける／消す"],["pick up / drop off","","拾う・迎えに行く／（車から）降ろす"],["check in / check out","","宿に入る手続き／宿を出る手続き"],["come in / go out","","中に入る／出かける"],["come back","","戻ってくる"],["look for","","探す"],["try on","","試着する"],["fill out / throw away","","（用紙に）記入する／捨てる"]],"ex":[["I {woke up} at five this morning.","今朝は5時に[目が覚めた]"],["Let's {go out} for dinner and {come back} early.","夕食に[出かけて]、早めに[戻ろう]"],["I'd like to {try on} this jacket.","このジャケットを[試着し]たいのですが"],["What time can we {check in}?","何時から[チェックイン]できますか？"],["I'm {looking for} my room key.","部屋の鍵を[探してる]"],["Can you {drop} me {off} at the station?","駅で[降ろして]くれる？"],["Please {fill out} this form.","この用紙に[記入して]ください"],["It's too loud. Can you {turn} it {off}?","うるさすぎる。それ、[消して]くれる？"]],"pt":["句動詞（動詞＋小さい言葉のセット）は、小さい言葉のイメージで覚える：on ＝ くっつく、off ＝ 離れる、up ＝ 上へ、out ＝ 外へ、back ＝ 元へ","wake up は「目が覚める」、get up は「ベッドから出る」。put on（身につける）⇔ take off（脱ぐ）、turn on（つける）⇔ turn off（消す）、pick up（迎えに行く）⇔ drop off（降ろす）","it / them は必ず間に入れる：turn it off / put it on / throw it away（× turn off it）。ふつうの名詞は前でも後ろでもOK：turn off the light ＝ turn the light off","look for は分けない：look for it（× look it for）。sit down / come in / go out / come back は後ろに「〜を」がいらない"],"q":[{"p":"This milk is old. I'll throw ___.","o":["it away","awa function jaHTML(s){return esc(s).replace(/\[([^\]]+)\]/g,'<b class="k j">$1</b>')}
function enPlain(s){return s.replace(/[{}*]/g,"")}
function jaPlain(s){return s.replace(/[\[\]]/g,"")}
function blanksHTML(s){return esc(s.replace(/\*/g,"")).replace(/\{([^}]+)\}/g,function(m,w){return w.split(" ").map(function(x){return '<span class="blank" style="--n:'+Math.max(2,x.length)+'"></span>'}).join(" ")})}
var NONE="（なし）";
function tidy(s){return s.replace(/\s{2,}/g," ").replace(/\s+([.,?!])/g,"$1").replace(/^\s+|\s+$/g,"")}
function pickFill(q,opt){return tidy(q.p.replace("___",opt===NONE?"":opt))}
function pickHTML(q,opt){if(opt===NONE)return esc(pickFill(q,opt));var a=q.p.split("___");return esc(a[0])+'<b class="k">'+esc(opt)+'</b>'+esc(a[1]||"")}
function pickBlankHTML(q){var a=q.p.split("___");return esc(a[0])+'<span class="blank" style="--n:5"></span>'+esc(a[1]||"")}
function optsSorted(q){return q.o.slice().sort(function(a,b){return a===NONE?1:b===NONE?-1:a.toLowerCase()<b.toLowerCase()?-1:1})}
function pad(n){return String(n).padStart(2,"0")}
function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
function isoDay(s){var p=s.split("-");return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function canon(o){if(Array.isArray(o))return "["+o.map(canon).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+":"+canon(o[k])}).join(",")+"}";return JSON.stringify(o)}

PT.forEach(function(p,i){LES[p.id]={kind:"a",i:i,o:p};p.dr.forEach(function(d,n){ITEM[p.id+"-"+(n+1)]={les:p.id,type:"say",ja:d[0],en:d[1]}})});

function fIdx(id){return +id.slice(1)}

function itemIds(lid){var L=LES[lid],n=L.kind==="a"?L.o.dr.length:L.o.q.length,r=[];for(var i=1;i<=n;i++)r.push(lid+"-"+i);return r}

/* ---------- state ---------- */
var KEY="s365.state",UI="s365.ui";
function fresh(){return {v:2,ts:0,start:0,srs:{},intro:{},fav:[],log:{},done:{},set:{amt:1,auto:true,slow:false}}}
function normalize(s){
  var f=fresh();if(!s||typeof s!=="object")return f;
  ["srs","intro","log","done","set"].forEach(function(k){if(!s[k]||typeof s[k]!=="object"||Array.isArray(s[k]))s[k]=f[k]});
  if(!Array.isArray(s.fav))s.fav=[];
  if(typeof s.ts!=="number")s.ts=0;
  if(typeof s.start!=="number")s.start=0;
  for(var k in f.set){if(s.set[k]==null)s.set[k]=f.set[k]}
  for(var id in s.srs){if(!Array.isArray(s.srs[id]))delete s.srs[id]}
  s.v=2;return s;
}
var stored=ls(KEY);
var st=normalize(stored);
if(!stored){
  var t0=today(),oldDone=ls("p100.done")||[],oldFav=ls("p100.fav")||[];
  oldDone.forEach(function(i){if(P[i])st.srs["f"+i]=[4,t0+2+(i%12),t0,1]});
  oldFav.forEach(function(i){if(P[i]&&st.fav.indexOf("f"+i)<0)st.fav.push("f"+i)});
  if(oldDone.length||oldFav.length)st.ts=1;
}

/* ---------- cloud save (owner, inside Claude only) ---------- */
var R={doc:null,status:"local",writing:false,again:false,timer:null,pending:null};
function queueRemote(){if(!R.doc)return;clearTimeout(R.timer);R.timer=setTimeout(flush,1200)}
function flush(){
  if(!R.doc)return;
  if(R.writing){R.again=true;return}
  R.writing=true;
  R.doc.set(JSON.parse(JSON.stringify(st))).then(function(){R.status="on"},function(e){R.status=(e&&e.code==="quota_exceeded")?"full":"err"}).then(function(){
    R.writing=false;renderSync();if(R.again){R.again=false;flush()}
  });
}
function mergeStates(a,b){
  var nw=(a.ts||0)>=(b.ts||0)?a:b,m=fresh(),k;
  m.ts=Math.max(a.ts||0,b.ts||0);
  m.start=[a.start,b.start].filter(Boolean).sort(function(x,y){return x-y})[0]||0;
  [a,b].forEach(function(s){for(k in s.srs){var e=s.srs[k],c=m.srs[k];if(!c||(e[3]||0)>(c[3]||0))m.srs[k]=e}});
  [a,b].forEach(function(s){for(k in s.intro){if(m.intro[k]==null||s.intro[k]<m.intro[k])m.intro[k]=s.intro[k]}});
  [a,b].forEach(function(s){for(k in s.log){m.log[k]=Math.max(m.log[k]||0,s.log[k])}});
  [a,b].forEach(function(s){for(k in s.done){var arr=m.done[k]||[];(s.done[k]||[]).forEach(function(x){if(arr.indexOf(x)<0)arr.push(x)});m.done[k]=arr}});
  m.fav=nw.fav.slice();m.set=JSON.parse(JSON.stringify(nw.set));
  return m;
}
function takeRemote(r){
  if(!r)return;
  if(S&&S.on){R.pending=r;return}
  r=normalize(JSON.parse(JSON.stringify(r)));
  var m=mergeStates(st,r);
  var changedLocal=canon(m)!==canon(st),changedRemote=canon(m)!==canon(r);
  if(changedLocal){st=m;persist();renderAll()}
  if(changedRemote)queueRemote();else R.status="on";
  renderSync();
}
function initRemote(){
  if(PWA||!window.claude||typeof window.claude.use!=="function")return;
  window.claude.use("user").then(function(user){
    if(!user)return null;
    return user.isOwner().then(function(own){return own?window.claude.use("db"):null});
  }).then(function(db){
    if(!db)return;
    try{R.doc=db.doc("coach/progress")}catch(e){return}
    R.status="sync";renderSync();
    return R.doc.get().then(function(snap){
      if(snap.exists)takeRemote(snap.data());else flush();
      R.doc.onSnapshot(function(s){if(s.exists&&!s.metadata.hasPendingWrites)takeRemote(s.data())},function(){});
    });
  }).catch(function(){R.status="err";renderSync()});
}

function importCode(s){

function sayText(id){if(isF(id))return enPlain(P[fIdx(id)][1]);var I=ITEM[id];return I.type==="pick"?pickFill(I.q,I.q.o[0]):enPlain(I.en)}
