/* ---------- learning model (spaced repetition) ---------- */
var IV=[0,1,3,7,16,35,90];
function boxOf(id){var e=st.srs[id];return e?e[0]:-1}
function solid(id){return boxOf(id)>=4}
function grade(id,g,failed){
  var t=today(),e=st.srs[id],b=e?e[0]:0,first=e?e[2]:t,miss=e&&e[4]?e[4]:0,nb,due;
  if(g===0){nb=1;due=t+1;miss++}
  else if(failed){nb=1;due=t+1}
  else{nb=Math.min(6,Math.max(0,b)+(g===2?2:1));due=t+IV[nb];if(nb>=4)miss=0}
  st.srs[id]=[nb,due,first,Date.now(),miss];
  st.log[t]=(st.log[t]||0)+1;
  save();
}
function togglePhraseSolid(i){
  var id="f"+i,t=today(),e=st.srs[id];
  if(e&&e[0]>=4)st.srs[id]=[2,t+1,e[2],Date.now(),e[4]||0];
  else st.srs[id]=[4,t+IV[4],e?e[2]:t,Date.now(),0];
  save();
}
var AMT=[{l:1,f:3,rev:30,n:"軽め"},{l:2,f:5,rev:50,n:"ふつう"},{l:3,f:8,rev:80,n:"がっつり"}];
function amt(){return AMT[st.set.amt]||AMT[1]}
function remaining(kind){return (kind==="k"?K:PT).filter(function(x){return st.intro[x.id]==null})}
function introToday(){var t=today(),n=0;for(var k in st.intro)if(st.intro[k]===t&&LES[k])n++;return n}
function newPhrToday(){var t=today(),n=0;for(var k in st.srs)if(isF(k)&&st.srs[k][2]===t&&st.srs[k][3]!==1)n++;return n}
/* New lessons for today: keep the two tracks level, and give each day one of each while both last. */
function nextLessons(n){
  var t=today(),day={k:0,a:0},id;
  for(id in st.intro)if(st.intro[id]===t&&LES[id])day[LES[id].kind]++;
  var rk=remaining("k"),ra=remaining("a"),dk=K.length-rk.length,da=PT.length-ra.length,ik=0,ia=0,out=[];
  while(out.length<n){
    var hasK=ik<rk.length,hasA=ia<ra.length,useK;
    if(!hasK&&!hasA)break;
    if(!hasA)useK=true;else if(!hasK)useK=false;
    else if(day.k+day.a>0&&day.k===0)useK=true;
    else if(day.k+day.a>0&&day.a===0)useK=false;
    else useK=(dk+ik)/K.length<=(da+ia)/PT.length;
    if(useK){out.push(rk[ik++].id);day.k++}else{out.push(ra[ia++].id);day.a++}
  }
  return out;
}
function nextPhr(n){var r=[];for(var i=0;i<P.length&&r.length<n;i++)if(!st.srs["f"+i])r.push(i);return r}
function dueIds(){var t=today(),r=[];for(var k in st.srs){if(st.srs[k][1]<=t&&valid(k))r.push(k)}r.sort(function(a,b){return st.srs[a][1]-st.srs[b][1]||st.srs[a][0]-st.srs[b][0]});return r}
function plan(extra){
  var a=amt();
  return {due:dueIds().slice(0,a.rev),les:nextLessons(Math.max(0,a.l-introToday())+(extra?1:0)),phr:nextPhr(Math.max(0,a.f-newPhrToday())+(extra?5:0))};
}
function freshItems(lid){return itemIds(lid).filter(function(id){return !st.srs[id]})}
function planCount(pl){var n=pl.due.length+pl.phr.length;pl.les.forEach(function(l){n+=freshItems(l).length});return n}
function planMinutes(pl){return Math.max(1,Math.round(planCount(pl)/3+pl.les.length*1.5+pl.phr.length/3))}
function queueFromPlan(pl){
  var qu=shuffle(pl.due.slice()).map(function(id){return {id:id}});
  pl.les.forEach(function(l){qu.push({intro:l});freshItems(l).forEach(function(id){qu.push({id:id})})});
  pl.phr.forEach(function(i){qu.push({id:"f"+i,learn:true})});
  return qu;
}
function expand(ids){
  var out=[],seen={};
  ids.forEach(function(id){
    if(isF(id)){out.push(st.srs[id]?{id:id}:{id:id,learn:true});return}
    var l=ITEM[id].les;if(st.intro[l]==null&&!seen[l]){out.push({intro:l});seen[l]=1}
    out.push({id:id});
  });
  return out;
}
function pickPractice(ids,n){
  var a=shuffle(ids.slice());
  a.sort(function(x,y){return (solid(x)?1:0)-(solid(y)?1:0)});
  a=a.slice(0,n);
  /* keep questions of one lesson together so a not-yet-seen lesson is explained once, right before them */
  var order={},k=0;a.forEach(function(id){var g=isF(id)?id:ITEM[id].les;if(order[g]==null)order[g]=k++});
  return a.sort(function(x,y){return order[isF(x)?x:ITEM[x].les]-order[isF(y)?y:ITEM[y].les]});
}

function heatHTML(){

    var ids=[];P.forEach(function(p,i){if(p[0]===ci&&include(i,p))ids.push(i)});
    if(!ids.length)return;any=true;var cc=chapCount(ci);
    out+='<section class="chap"><div class="chap-h"><span class="chap-n">'+pad(ci+1)+'</span><div class="chap-t"><h2>'+esc(c[0])+'</h2><p>'+esc(c[1])+'</p></div>'+(prog?'<span class="chap-p">'+cc[0]+'<small>/'+cc[1]+'</small></span>':'')+'</div><div class="list">'+ids.map(phrRow).join("")+'</div></section>';
  });
  return {html:out,any:any};
}
function renderList(){
  var ql=q.trim().toLowerCase();
  var r=chapters(function(i,p){
    if(ql){return (enPlain(p[1])+" "+p[2]+" "+p[3]+" "+p[4]+" "+p[5]+" "+p[6]).toLowerCase().indexOf(ql)>-1}
    return stepOf(p[0])===step&&(chap===-1||chap===p[0]);
  },true);
  $("list").innerHTML=r.any?(ql?'<p class="searching">'+P.length+'フレーズ全部から検索しています</p>':"")+r.html:'<p class="empty">「'+esc(q)+'」に合うフレーズはありません。<br>別の言葉で探してみてください。</p>';
  document.body.classList.toggle("hide-en",hideEn);
  $("hideBtn").setAttribute("aria-pressed",String(hideEn));
}

/* ---------- favorites ---------- */
function renderFavs(){
  var has=function(id){return st.fav.indexOf(id)>-1};
  var ks=K.filter(function(k){return has(k.id)}),as=PT.filter(function(p){return has(p.id)}),phr=st.fav.filter(function(id){return isF(id)&&P[fIdx(id)]});
  var total=ks.length+as.length+phr.length;
  var h='<div class="fav-head"><div><h2 class="v-title">お気に入り</h2><p class="small muted">きほん '+ks.length+' ・ 型 '+as.length+' ・ フレーズ '+phr.length+'</p></div>'+(total?'<button class="act main" data-prac="fav">まとめて練習</button>':'')+'</div>';
  if(!total){
    h+='<div class="fav-empty">'+IC.star+'<h3>まだお気に入りはありません</h3><p>レッスンやフレーズの右にある星をタップすると、ここに集まります。旅先ですぐ使いたいものを入れておくと便利です。</p><button class="act main" data-tab="phrases">フレーズを見る</button></div>';
  }else{
    if(ks.length)h+='<div class="sec-h"><h2>きほん</h2></div><div class="list">'+ks.map(function(k){return lesRow(k.id)}).join("")+'</div>';
    if(as.length)h+='<div class="sec-h"><h2>型</h2></div><div class="list">'+as.map(function(p){return lesRow(p.id)}).join("")+'</div>';
    if(phr.length)h+='<div class="sec-h"><h2>フレーズ</h2></div><div>'+chapters(function(i){return has("f"+i)},false).html+'</div>';
  }
  $("v-favs").innerHTML=h;
}
function toggleFav(id){
  var i=st.fav.indexOf(id);if(i>-1)st.fav.splice(i,1);else st.fav.push(id);save();
  var on=st.fav.indexOf(id)>-1;
  document.querySelectorAll('.fav[data-fav="'+id+'"]').forEach(function(b){b.setAttribute("aria-pressed",String(on))});
  renderHeader();
}

/* ---------- training session ---------- */
var S=null;
function startSession(items,kind){
  if(!items.length)return;
  S={on:true,q:items,pos:0,rev:false,hint:false,picked:null,fails:{},rq:{},n:0,kind:kind};
  $("sheet").hidden=false;document.body.style.overflow="hidden";renderSession(true);
}
function endSession(){
  if(!S)return;S.on=false;S=null;$("sheet").hidden=true;document.body.style.overflow="";
  try{speechSynthesis.cancel()}catch(e){}
  if(R.pending){var r=R.pending;R.pending=null;takeRemote(r)}
  renderAll();
}
function itemTag(it){
  if(it.intro){var L=LES[it.intro];return '<span class="tag"><b>新しい'+(L.kind==="k"?"きほん":"型")+'</b> #'+pad(L.i+1)+(L.kind==="k"?' ・ '+esc(UNITS[L.o.u][0]):'')+'</span>'}
  if(!isF(it.id)){var l=ITEM[it.id].les;return '<span class="tag">'+lesLabel(l)+' ・ '+esc(LES[l].o.t)+'</span>'}
  var p=P[fIdx(it.id)];return '<span class="tag">'+(it.learn?"<b>新しいフレーズ</b>":"フレーズ")+' ・ '+esc(CH[p[0]][0])+'</span>';
}
function renderSession(top){
  var total=S.q.length,pos=S.pos,body="",ctl="";
  $("sBar").style.width=(Math.min(pos,total)/total*100)+"%";
  $("sCount").textContent=pos<total?(pos+1)+" / "+total:"";
  if(pos>=total){
    var t=today(),cl=planCount(plan(false))===0;
    body='<div class="fc done-card"><div class="big">'+S.n+'</div><p>問、やりきりました</p><p class="small muted">連続 '+streak()+' 日 ・ 今日の合計 '+(st.log[t]||0)+' 問</p>'+(S.kind==="today"&&cl?'<p><b>今日の分はクリア。あとはミッションで実際に話してみよう</b></p><p class="small muted">'+esc(mission())+'</p>':'')+'</div>';
    ctl=(S.kind==="today"?'<button class="btn" id="sMore">もう少しやる</button>':'')+'<button class="btn primary" id="sDone">閉じる</button>';
    $("sBody").innerHTML=body;$("sCtl").innerHTML=ctl;$("sheet").scrollTop=0;return;
  }
  var it=S.q[pos];
  if(it.intro){
    var L=LES[it.intro],o=L.o,nq=itemIds(it.intro).length;
    body='<div class="fc"><div class="fc-meta">'+itemTag(it)+favBtn(it.intro,"fc-fav")+'</div><h2 class="intro-stem">'+esc(o.t)+'</h2>';
    if(L.kind==="k")body+='<span class="det-j">'+esc(o.j)+'</span><div>'+coresHTML(o)+'</div>'+ptsHTML(o.pt)+exHTML(o.ex);
    else body+='<span class="det-k">'+esc(o.k)+'</span><span class="det-j">'+esc(o.j)+'</span>'+exHTML([o.c])+ptsHTML(o.pt);
    body+='</div>';
    ctl='<button class="btn primary" id="sIntro">わかった、問題へ<small>'+nq+'問</small></button>';
  }else if(it.learn){
    var f=P[fIdx(it.id)];
    body='<div class="fc"><div class="fc-meta">'+itemTag(it)+favBtn(it.id,"fc-fav")+'</div><p class="fc-ja">'+esc(f[3])+'</p><div class="fc-ans"><p class="fc-en">'+enHTML(f[1])+'</p><p class="fc-kana">'+esc(f[2])+'</p>'+playBtns(enPlain(f[1]))+'<p class="note">'+esc(f[4])+'</p></div><p class="fc-say">音声のあとに続けて2回声に出したら次へ。少しあとでテストに出ます。</p></div>';
    ctl='<button class="btn primary" id="sLearn">言ってみた、次へ</button>';
  }else if(isF(it.id)){
    var g=P[fIdx(it.id)];
    body='<div class="fc"><div class="fc-meta">'+itemTag(it)+favBtn(it.id,"fc-fav")+'</div><p class="fc-ja">'+esc(g[3])+'</p>';
    if(!S.rev){body+='<p class="fc-say">英語で声に出してから、答えを見る</p></div>';ctl='<button class="btn primary" id="sReveal">答えを見る</button>'}
    else{body+='<div class="fc-ans"><p class="fc-en">'+enHTML(g[1])+'</p><p class="fc-kana">'+esc(g[2])+'</p>'+playBtns(enPlain(g[1]))+'<p class="note">'+esc(g[4])+'</p></div></div>';ctl=gradeBtns()}
  }else{
    var I=ITEM[it.id];
    body='<div class="fc"><div class="fc-meta">'+itemTag(it)+favBtn(I.les,"fc-fav")+'</div>';
    if(I.type==="pick"){
      var qq=I.q,ans=qq.o[0],done=S.picked!=null,right=S.picked===ans;
      if(!it.opts)it.opts=shuffle(qq.o.slice());
      body+='<p class="fc-q">'+(done?pickHTML(qq,ans):pickBlankHTML(qq))+'</p><p class="fc-sub">'+esc(qq.j)+'</p><div class="opts">';
      it.opts.forEach(function(o2){
        var cls="",ic="";
        if(done){if(o2===ans){cls=right?" right":" answer";ic=right?IC.check:""}else if(o2===S.picked)cls=" wrong"}
        body+='<button class="opt'+cls+'" data-opt="'+esc(o2)+'"'+(done?" disabled":"")+'><span>'+esc(o2)+'</span>'+ic+'</button>';
      });
      body+='</div>';
      if(done){
        body+='<div class="fc-ans"><p class="verdict'+(right?" good":"")+'">'+(right?IC.check+'正解':'おしい。赤が正解')+'</p><p class="why">'+esc(qq.w)+'</p>'+playBtns(pickFill(qq,ans))+'</div><p class="fc-say">完成した文を声に出してから、次へ</p></div>';
        ctl='<button class="btn primary" id="sNext">次へ</button>';
      }else body+='<p class="fc-say">空いているところに入る言葉を選ぶ</p></div>';
    }else{
      body+='<p class="fc-ja">'+(S.rev?jaHTML(I.ja):esc(jaPlain(I.ja)))+'</p>';
      if(!S.rev){
        if(S.hint)body+='<p class="fc-hint">'+blanksHTML(I.en)+'</p>';
        body+='<p class="fc-say">英語で声に出してから、答えを見る</p></div>';
        ctl=(S.hint?'':'<button class="btn" id="sHint">ヒント</button>')+'<button class="btn primary" id="sReveal">答えを見る</button>';
      }else{
        body+='<div class="fc-ans"><p class="fc-en">'+enHTML(I.en)+'</p>'+playBtns(enPlain(I.en))+'</div></div>';
        ctl=gradeBtns();
      }
    }
  }
  $("sBody").innerHTML=body;$("sCtl").innerHTML=ctl;
  if(top)$("sheet").scrollTop=0;
  else{var a=$("sBody").querySelector(".fc-ans");if(a&&a.scrollIntoView)try{a.scrollIntoView({block:"center"})}catch(e){}}
}
function gradeBtns(){return '<button class="btn" id="sG0">まだ<small>もう一回</small></button><button class="btn ok" id="sG1">言えた</button><button class="btn ok2" id="sG2">楽勝<small>間隔をあける</small></button>'}
function sNext(){S.pos++;S.rev=false;S.hint=false;S.picked=null;renderSession(true)}
function requeue(id){S.fails[id]=1;S.rq[id]=(S.rq[id]||0)+1;if(S.rq[id]<=2)S.q.splice(Math.min(S.pos+4,S.q.length),0,{id:id})}
function sGrade(g){
  var id=S.q[S.pos].id;
  if(g===0){requeue(id);grade(id,0)}else grade(id,g,!!S.fails[id]);
  S.n++;sNext();
}
function sPick(opt){
  if(S.picked!=null)return;
  var id=S.q[S.pos].id,qq=ITEM[id].q;
  S.picked=opt;
  if(opt===qq.o[0])grade(id,1,!!S.fails[id]);else{requeue(id);grade(id,0)}
  S.n++;renderSession(false);
  if(st.set.auto)speak(pickFill(qq,qq.o[0]));
}
function startToday(extra){startSession(queueFromPlan(plan(extra)),"today")}
function startPractice(kind){
  var ids=[],n=20,c=kind.charAt(0),v=+kind.slice(1);
  if(kind==="fav"){st.fav.forEach(function(id){if(isF(id)){if(P[fIdx(id)])ids.push(id)}else if(LES[id])ids=ids.concat(itemIds(id))});n=25;
    if(!ids.length){toast("お気に入りはまだありません。星をタップすると、ここで練習できます");return}}
  else if(kind==="weak"){for(var k in st.srs){var e=st.srs[k];if((e[4]||0)>0&&e[0]<4&&valid(k))ids.push(k)}
    if(!ids.length){toast("苦手はまだありません。まちがえた問題や「まだ」を押したものがここに集まります");return}}
  else if(c==="u")K.forEach(function(x){if(x.u===v)ids=ids.concat(itemIds(x.id))});
  else if(c==="s")PT.slice(v*20,v*20+20).forEach(function(p){ids=ids.concat(itemIds(p.id))});
  else if(c==="p")P.forEach(function(p,i){if(stepOf(p[0])===v)ids.push("f"+i)});
  startSession(expand(pickPractice(ids,n)),"free");
}
var toastT=null;
function toast(msg){var el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},3600)}
function applySheet(){document.body.classList.toggle("sheet-on",sheetOn)}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  if(!e.target.closest)return;
  var t=e.target.closest("button");
  if(!t){
    var red=sheetOn&&e.target.closest(".study b.k:not(.j)");
    if(red)red.classList.toggle("shown");
    return;
  }
  var d=t.dataset;
  if(d.fav!=null){toggleFav(d.fav);return}
  if(d.say!=null){speak(d.say,false);return}
  if(d.slow!=null){speak(d.slow,true);return}
  if(d.opt!=null){sPick(d.opt);return}
  if(d.tab){if(S)endSession();setTab(d.tab);return}
  if(d.prac){startPractice(d.prac);return}
  if(d.open!=null){if(d.open)openDetail(d.open);return}
  if(d.unit!=null){unit=+d.unit;saveUi();renderUnitChips();renderCore();window.scrollTo(0,0);return}
  if(d.stage!=null){stage=+d.stage;saveUi();renderStageChips();renderPatterns();window.scrollTo(0,0);return}
  if(d.step!=null){step=+d.step;chap=-1;saveUi();renderSteps();renderChips();renderList();window.scrollTo(0,0);return}
  if(d.chap!=null){chap=+d.chap;saveUi();renderChips();renderList();window.scrollTo(0,0);return}
  if(d.done!=null){toggleDone(d.done);var on=doneHas(d.done);t.setAttribute("aria-pressed",String(on));if(d.done==="m")t.innerHTML=IC.check+(on?"やった":"やったらタップ");return}
  if(d.amt!=null){st.set.amt=+d.amt;save();renderAll();return}
  if(d.auto!=null){st.set.auto=d.auto==="1";save();renderToday();return}
  if(d.slowset!=null){st.set.slow=d.slowset==="1";save();renderToday();return}
  if(d.got!=null){var gi=+d.got;togglePhraseSolid(gi);var so=solid("f"+gi);t.setAttribute("aria-pressed",String(so));var art=t.closest(".ph");if(art)art.classList.toggle("done",so);var sec=t.closest(".chap"),cp=sec&&sec.querySelector(".chap-p");if(cp){var cc=chapCount(P[gi][0]);cp.innerHTML=cc[0]+"<small>/"+cc[1]+"</small>"}if(tab==="phrases"){renderSteps();renderChips()}renderHeader();return}
  if(d.hint!=null||d.ans!=null){var box=t.closest("[data-drill]"),el=box.querySelector(d.hint!=null?".hint":".ans"),show=el.hidden;el.hidden=!show;t.setAttribute("aria-pressed",String(show));if(d.ans!=null&&show&&st.set.auto)speak(sayText(d.ans));return}
  if(t.classList.contains("ph-head")){var a2=t.closest(".ph"),i2=+a2.dataset.i,o=!openSet[i2];if(o)openSet[i2]=1;else delete openSet[i2];a2.classList.toggle("open",o);t.setAttribute("aria-expanded",String(o));var b2=a2.querySelector(".ph-body");if(o&&!b2.innerHTML)b2.innerHTML=phrBody(i2);b2.hidden=!o;return}
  switch(t.id){
    case "goToday":startToday(false);break;
    case "goExtra":var ex=queueFromPlan(plan(true));if(!ex.length){toast("新しい内容はすべて学習済みです。「自由に練習」で復習しよう");break}startSession(ex,"today");break;
    case "backBtn":closeDetail();break;
    case "sheetBtn":sheetOn=!sheetOn;saveUi();applySheet();t.setAttribute("aria-pressed",String(sheetOn));document.querySelectorAll(".study .k.shown").forEach(function(x){x.classList.remove("shown")});break;
    case "pracLes":var lid=detail;if(st.intro[lid]==null){st.intro[lid]=today();save()}startSession(itemIds(lid).map(function(id){return {id:id}}),"free");break;
    case "hideBtn":hideEn=!hideEn;saveUi();renderList();break;
    case "expBtn":xfer=xfer==="exp"?"":"exp";renderToday();if(xfer){var eb=$("expBox");if(eb&&eb.scrollIntoView)eb.scrollIntoView({block:"center"})}break;
    case "impOpen":xfer=xfer==="imp"?"":"imp";renderToday();if(xfer){var ib=$("impBox");if(ib){ib.scrollIntoView({block:"center"});ib.focus()}}break;
    case "expCopy":var box2=$("expBox");copyText(box2.value,box2);break;
    case "impGo":try{importCode($("impBox").value);xfer="";renderAll();toast("記録を読み込みました")}catch(err){toast("コードを読み取れませんでした。S365: から最後まで、全部を貼り付けてください")}break;
    case "sClose":case "sDone":endSession();break;
    case "sMore":S.kind="today";var more=queueFromPlan(plan(true));if(!more.length){toast("今日はもう新しい内容がありません。「自由に練習」で復習しよう");break}S.q=S.q.concat(more);renderSession(true);break;
    case "sIntro":var ip=S.q[S.pos].intro;if(st.intro[ip]==null){st.intro[ip]=today();save()}sNext();break;
    case "sLearn":var pid=S.q[S.pos].id;S.q.splice(Math.min(S.pos+4,S.q.length),0,{id:pid});sNext();break;
    case "sHint":S.hint=true;renderSession(true);break;
    case "sReveal":S.rev=true;renderSession(false);if(st.set.auto)speak(sayText(S.q[S.pos].id));break;
    case "sNext":sNext();break;
    case "sG0":sGrade(0);break;
    case "sG1":sGrade(1);break;
    case "sG2":sGrade(2);break;
  }
});
$("q").addEventListener("input",function(e){q=e.target.value;renderList()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S)endSession()});

/* ---------- boot ---------- */
try{document.documentElement.lang="ja"}catch(e){}
/* first run: record the start day without stamping the save as "new", so an existing cloud save still wins */
if(!st.start){st.start=today();persist()}
applySheet();
setTab(tab);
initRemote();
initOffline();
setInterval(function(){if(!S&&tab==="today"&&detail==null&&!document.hidden){var d=dayNo();if(+$("hdDay").textContent!==d)renderAll()}},60000);
})();

</script>
